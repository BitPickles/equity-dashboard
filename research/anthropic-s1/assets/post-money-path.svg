<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 576" width="2160" height="1152" role="img" aria-label="C 至 H 轮投后估值路径">
  <defs>
    <linearGradient id="barGrad0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aafff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8aafff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aafff" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#8aafff" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aafff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#8aafff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aafff" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#8aafff" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aafff" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#8aafff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="barGrad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8aafff" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1080" height="576" fill="#10141d"/>
  <!-- panel -->
  <rect x="24" y="20" width="1032" height="536" rx="16" fill="#1a2130" stroke="#333c4e" stroke-width="1"/>

  <!-- annotation card -->
  <rect x="48" y="40" width="268" height="56" rx="10" fill="#10141d" stroke="#333c4e" stroke-width="1"/>
  <text x="64" y="64" fill="#8aafff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16" font-weight="600">C 轮 → H 轮约 219 倍</text>
  <text x="64" y="84" fill="#adb7ca" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13">G → H 仅隔约 3 个月</text>

  <!-- chart area: pad top 110, right 48, bottom 78, left 48 -->
  <!-- plotW=984, plotH=368, baseline=478 -->
  <!-- gap=28, barW=(984-140)/6=140.666... use 140, gap=28.8 approx -->

  <!-- grid lines at 25/50/75/100% -->
  <line x1="48" y1="110" x2="1032" y2="110" stroke="#333c4e" stroke-width="1" opacity="0.55"/>
  <line x1="48" y1="202" x2="1032" y2="202" stroke="#333c4e" stroke-width="1" opacity="0.55"/>
  <line x1="48" y1="294" x2="1032" y2="294" stroke="#333c4e" stroke-width="1" opacity="0.55"/>
  <line x1="48" y1="386" x2="1032" y2="386" stroke="#333c4e" stroke-width="1" opacity="0.55"/>
  <!-- baseline -->
  <line x1="48" y1="478" x2="1032" y2="478" stroke="#333c4e" stroke-width="1.75"/>

  <!-- bars: max=965, plotH=368, minBarH=18
       barW=141, gap=28.2 → positions:
       i=0 x=48
       i=1 x=48+169.2=217.2
       i=2 x=386.4
       i=3 x=555.6
       i=4 x=724.8
       i=5 x=894
  -->
  <!-- C 4.4 → h=max(4.4/965*368,18)=18 -->
  <rect x="48" y="460" width="141" height="18" rx="7" fill="url(#barGrad0)"/>
  <text x="118.5" y="448" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="600">约 4.4B</text>
  <text x="118.5" y="502" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="500">C 轮</text>
  <text x="118.5" y="522" text-anchor="middle" fill="#adb7ca" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13">2023.5</text>

  <!-- D 14 → h=max(14/965*368,18)=18 -->
  <rect x="217.2" y="460" width="141" height="18" rx="7" fill="url(#barGrad1)"/>
  <text x="287.7" y="448" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="600">约 14B</text>
  <text x="287.7" y="502" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="500">D 轮</text>
  <text x="287.7" y="522" text-anchor="middle" fill="#adb7ca" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13">2024初</text>

  <!-- E 61.5 → h=max(61.5/965*368,18)=23.45 -->
  <rect x="386.4" y="454.55" width="141" height="23.45" rx="7" fill="url(#barGrad2)"/>
  <text x="456.9" y="442.55" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="600">61.5B</text>
  <text x="456.9" y="502" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="500">E 轮</text>
  <text x="456.9" y="522" text-anchor="middle" fill="#adb7ca" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13">2025.3</text>

  <!-- F 183 → h=69.79 -->
  <rect x="555.6" y="408.21" width="141" height="69.79" rx="7" fill="url(#barGrad3)"/>
  <text x="626.1" y="396.21" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="600">183B</text>
  <text x="626.1" y="502" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="500">F 轮</text>
  <text x="626.1" y="522" text-anchor="middle" fill="#adb7ca" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13">2025.9</text>

  <!-- G 380 → h=144.91 -->
  <rect x="724.8" y="333.09" width="141" height="144.91" rx="7" fill="url(#barGrad4)"/>
  <text x="795.3" y="321.09" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="600">380B</text>
  <text x="795.3" y="502" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="500">G 轮</text>
  <text x="795.3" y="522" text-anchor="middle" fill="#adb7ca" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13">2026.2</text>

  <!-- H 965 → h=368 -->
  <rect x="894" y="110" width="141" height="368" rx="7" fill="url(#barGrad5)" filter="url(#softShadow)"/>
  <text x="964.5" y="98" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16" font-weight="700">965B</text>
  <text x="964.5" y="502" text-anchor="middle" fill="#e9ecf5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" font-weight="500">H 轮</text>
  <text x="964.5" y="522" text-anchor="middle" fill="#adb7ca" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13">2026.5</text>

  <!-- arcs + multiples
       centers: 118.5, 287.7, 456.9, 626.1, 795.3, 964.5
       bar tops (baseline - h): 460, 460, 454.55, 408.21, 333.09, 110
  -->
  <!-- C→D ×3.2 -->
  <path d="M 149.5 457 C 185 420, 221 420, 256.7 457" fill="none" stroke="#e9ecf5" stroke-width="1.6" opacity="0.72" stroke-linecap="round"/>
  <polygon points="256.7,457 248.5,450.5 254.5,448" fill="#e9ecf5" opacity="0.88"/>
  <rect x="183" y="400" width="44" height="20" rx="10" fill="#8aafff" fill-opacity="0.18" stroke="#8aafff" stroke-width="1"/>
  <text x="205" y="414" text-anchor="middle" fill="#8aafff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="600">×3.2</text>

  <!-- D→E ×4.4 -->
  <path d="M 318.7 457 C 354 418, 390 418, 425.9 451.55" fill="none" stroke="#e9ecf5" stroke-width="1.6" opacity="0.72" stroke-linecap="round"/>
  <polygon points="425.9,451.55 417.7,445 423.7,442.5" fill="#e9ecf5" opacity="0.88"/>
  <rect x="352.5" y="398" width="44" height="20" rx="10" fill="#8aafff" fill-opacity="0.18" stroke="#8aafff" stroke-width="1"/>
  <text x="374.5" y="412" text-anchor="middle" fill="#8aafff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="600">×4.4</text>

  <!-- E→F ×3.0 -->
  <path d="M 487.9 451.55 C 523 400, 559 400, 595.1 405.21" fill="none" stroke="#e9ecf5" stroke-width="1.6" opacity="0.72" stroke-linecap="round"/>
  <polygon points="595.1,405.21 586.9,398.7 592.9,396.2" fill="#e9ecf5" opacity="0.88"/>
  <rect x="521.5" y="380" width="44" height="20" rx="10" fill="#8aafff" fill-opacity="0.18" stroke="#8aafff" stroke-width="1"/>
  <text x="543.5" y="394" text-anchor="middle" fill="#8aafff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="600">×3.0</text>

  <!-- F→G ×2.1 -->
  <path d="M 657.1 405.21 C 693 340, 729 340, 764.3 330.09" fill="none" stroke="#e9ecf5" stroke-width="1.6" opacity="0.72" stroke-linecap="round"/>
  <polygon points="764.3,330.09 756.1,323.6 762.1,321.1" fill="#e9ecf5" opacity="0.88"/>
  <rect x="690.5" y="312" width="44" height="20" rx="10" fill="#8aafff" fill-opacity="0.18" stroke="#8aafff" stroke-width="1"/>
  <text x="712.5" y="326" text-anchor="middle" fill="#8aafff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="600">×2.1</text>

  <!-- G→H ×2.5 -->
  <path d="M 826.3 330.09 C 870 200, 910 160, 933.5 107" fill="none" stroke="#e9ecf5" stroke-width="1.6" opacity="0.72" stroke-linecap="round"/>
  <polygon points="933.5,107 924.8,111.5 927.2,104" fill="#e9ecf5" opacity="0.88"/>
  <rect x="858" y="168" width="44" height="20" rx="10" fill="#8aafff" fill-opacity="0.22" stroke="#8aafff" stroke-width="1"/>
  <text x="880" y="182" text-anchor="middle" fill="#8aafff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" font-weight="600">×2.5</text>
</svg>
