<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>存储周期看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<style>
  /* ===== 单图工作台 · 页面独有样式（设计 token 全部来自 shared.css） ===== */

  /* [hidden] 权威：本页用 hidden 属性做显隐切换，需压过自带 display 的类 */
  [hidden] { display: none !important; }

  /* —— 两栏布局：左指标列表 240px + 右工作区 —— */
  .workbench { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--gap-wide); align-items: start; }

  /* 左侧指标列表 */
  .side { padding: 14px 12px; gap: 14px; position: sticky; top: 18px; }
  .m-group { display: flex; flex-direction: column; gap: 5px; }
  .m-group-title { font: 600 10.5px var(--font-mono); color: var(--faint); letter-spacing: .14em; padding: 0 10px; }
  .m-group-items { display: flex; flex-direction: column; gap: 2px; }
  .m-item {
    display: block; width: 100%; text-align: left; font-size: 13px; padding: 7px 10px;
    border: none; border-radius: var(--r-sm); background: transparent; color: var(--muted); cursor: pointer;
  }
  .m-item:hover { background: var(--row-line); color: var(--ink); }
  .m-item.is-active { background: var(--dark); color: var(--on-dark); font-weight: 700; }

  /* 右侧工作区 */
  .work { gap: 13px; }
  .work-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .work-title { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: .01em; }
  .ctrls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* 主图区：LWC / ECharts 严格分容器 */
  .chart-stage { position: relative; width: 100%; height: 440px; }
  #lwcMain > div { position: absolute; inset: 0; }   /* 叠加图各 metric×range 的 box 互斥显隐 */
  .small-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .small-cell { border: 1px solid var(--border-soft); border-radius: var(--r-md); padding: 8px; }
  .cell-head { font-size: 12.5px; font-weight: 700; padding: 2px 6px 6px; }
  .chart-small { width: 100%; height: 250px; }
  .cell-note { height: 250px; display: flex; align-items: center; justify-content: center; font: 500 11.5px var(--font-mono); color: var(--ghost); }

  /* 图下三行：统计行（中性灰）/ 口径行（caveat-bar 复用）/ 来源行 */
  .stats-block { display: flex; flex-direction: column; }
  .stat-row { padding: 8px 0 10px; border-top: 1px solid var(--border-soft); }
  .stat-row:first-child { border-top: none; padding-top: 0; }
  .s-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .s-name { font-size: 12.5px; font-weight: 700; }
  .s-body { font: 500 11px var(--font-mono); color: var(--muted); }
  .stat-row .range-track { margin-top: 7px; }
  .src-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--faint); }
  .src-row a { color: var(--muted); }
  .src-row a:hover { color: var(--ink); }

  /* —— v0.5:叠加对比控件 / 统计分段头 / 指标解释 / 原始数据表 / 导出小按钮 —— */
  .overlay-sel {
    font-size: 12px; padding: 6px 10px; max-width: 138px;
    border: 1px dashed var(--border-line); border-radius: var(--r-pill);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .overlay-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; padding: 6px 11px;
    border: 1.5px solid var(--dark); border-radius: var(--r-pill);
    background: var(--dark); color: var(--on-dark);
  }
  .overlay-chip button {
    border: none; background: transparent; color: inherit; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 1px;
  }
  .stat-sec-head { font: 600 10.5px var(--font-mono); color: var(--faint); letter-spacing: .12em; padding: 6px 0 4px; }
  .stat-sec-head + .stat-row { border-top: none; }
  .metric-explain { font-size: 11px; color: var(--faint); line-height: 1.75; }
  .metric-explain .me-tag { font-weight: 700; margin-right: 6px; }
  .metric-explain .me-name { font-weight: 700; margin-top: 6px; }
  .metric-explain .me-name:first-child { margin-top: 0; }
  .btn-export-min { font-size: 11.5px; padding: 5px 10px; }
  /* F3:「历史周期」开关不可用态（非单公司视图 / 该公司无 bands） */
  #bandSeg button:disabled { color: var(--ghost); cursor: not-allowed; }
  .raw-data { border-top: 1px solid var(--border-soft); padding-top: 9px; }
  /* F5:数据表入口按钮化——边框 + field-bg 底 + 圆角，行数加粗，hover 变 ink */
  .raw-data > summary {
    display: inline-block; cursor: pointer; list-style: none;
    font: 500 11.5px var(--font-mono); color: var(--muted);
    border: 1px solid var(--border-line); border-radius: var(--r-sm);
    background: var(--field-bg); padding: 8px 12px;
  }
  .raw-data > summary:hover { color: var(--ink); }
  .raw-data > summary b { font-weight: 700; }
  .raw-data > summary::-webkit-details-marker { display: none; }
  .raw-data > summary .caret::before { content: '▸ '; }
  .raw-data[open] > summary .caret::before { content: '▾ '; }
  .raw-head { display: flex; align-items: center; gap: 10px; margin: 10px 0 2px; }
  .raw-sub { font: 600 11px var(--font-mono); color: var(--muted); padding: 10px 0 2px; }
  .raw-wrap { overflow-x: auto; }
  .raw-table { width: 100%; border-collapse: collapse; font: 400 11.5px var(--font-mono); color: var(--muted); }
  .raw-table th {
    text-align: left; font-weight: 600; color: var(--faint); padding: 6px 12px 6px 0;
    border-bottom: 1px solid var(--border-line); white-space: nowrap;
  }
  .raw-table td { padding: 4px 12px 4px 0; border-bottom: 1px solid var(--row-line); white-space: nowrap; }
  .raw-table th.num, .raw-table td.num { text-align: right; }
  .raw-more {
    margin: 10px 0 2px; font-size: 11.5px; padding: 5px 14px;
    border: 1px solid var(--border-line); border-radius: var(--r-xs);
    background: var(--field-bg); color: var(--muted); cursor: pointer;
  }
  .raw-total { margin: 10px 0 2px; font: 500 11px var(--font-mono); color: var(--ghost); }

  /* —— W11 · F1：Forward P/E 当前值块（仅 pe 视图；浅琥珀 caveat 样式，与统计行中性灰区分） —— */
  .fwd-block {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--amber-bg); border: 1px solid var(--amber-line);
    border-radius: var(--r-sm); padding: 10px 14px;
  }
  .fwd-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .fwd-title { font-size: 12.5px; font-weight: 700; color: var(--amber-ink); }
  .fwd-caveat { font: 500 10.5px var(--font-mono); color: var(--amber-ink); letter-spacing: .01em; }
  .fwd-rows { display: flex; flex-wrap: wrap; gap: 8px 26px; }
  .fwd-cell { display: inline-flex; align-items: baseline; gap: 7px; }
  .fwd-cell .dot { align-self: center; }
  .fwd-cell .fw-name { font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .fwd-cell .fw-val  { font: 600 13px var(--font-mono); color: var(--ink); }
  .fwd-cell .fw-an   { font: 500 10.5px var(--font-mono); color: var(--faint); }
  .fwd-cell .fw-na   { font: 600 13px var(--font-mono); color: var(--ghost); }

  /* —— W11 · F2c：capex 视图扩产计划附注（不进曲线） —— */
  .capex-note {
    display: flex; flex-direction: column; gap: 7px;
    border: 1px solid var(--border-soft); border-radius: var(--r-md);
    background: var(--subcard-bg); padding: 11px 14px;
  }
  .capex-note .cn-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .capex-note .cn-title { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
  .capex-note .cn-sub { font: 500 10.5px var(--font-mono); color: var(--faint); }
  .capex-note .cn-co { display: flex; flex-direction: column; gap: 2px; }
  .capex-note .cn-co-name { font-size: 11.5px; font-weight: 700; }
  .capex-note .cn-item { font-size: 11.5px; color: var(--ink-2); line-height: 1.7; padding-left: 10px; }
  .capex-note .cn-item .b { color: var(--hairline); margin-right: 5px; }
  .capex-note .cn-go { font-size: 12px; color: var(--link); text-decoration: none; align-self: flex-start; }
  .capex-note .cn-go:hover { text-decoration: underline; }

  footer.pg a { color: var(--muted); text-decoration: none; }
  footer.pg a:hover { color: var(--ink); }

  /* ===== W10 · F1 纯图表全屏 / F2 区间测量 / 折叠信息条 ===== */

  /* 全屏态:CSS 回退（Fullscreen API 不可用/失败时)与 API 态共用同一批布局规则。
     .work.is-fs 由 JS 切;CSS 回退再叠 .work--css-fs 补 position:fixed。 */
  .work--css-fs { position: fixed; inset: 0; z-index: 9000; margin: 0; border-radius: 0; overflow: auto; }
  /* W10 修复:全屏态(API/CSS 回退)下导出弹层须盖住全屏卡内容——
     弹层现为 .work 子节点,在 .work 建立的堆叠上下文内以高 z-index 置顶(shared.css .export-overlay 仅 z-index:50)。 */
  .work.is-fs #exportOverlay,
  .work--css-fs #exportOverlay { z-index: 9500; }
  /* Fullscreen API 下 .work 铺满屏幕,给足内边距 */
  .work.is-fs { background: var(--card); display: flex; flex-direction: column; }
  .work:fullscreen { background: var(--card); padding: 16px 20px; overflow: auto; }
  .work:-webkit-full-screen { background: var(--card); padding: 16px 20px; overflow: auto; }
  /* 全屏时图表区吃满剩余高度（用 flex,不硬编码像素） */
  .work.is-fs .chart-stage { flex: 1 1 auto; height: auto; min-height: 0; }
  .work.is-fs .small-grid { flex: 1 1 auto; overflow: auto; align-content: start; }
  /* 全屏时:图下三行折叠进信息条,数据表不进全屏 */
  .work.is-fs .stats-block,
  .work.is-fs .fwd-block,
  .work.is-fs .capex-note,
  .work.is-fs .caveat-bar,
  .work.is-fs .metric-explain,
  .work.is-fs .src-row,
  .work.is-fs .raw-data { display: none; }
  .work.is-fs .fs-infobar { display: block; }

  /* 折叠信息条（仅全屏可见;默认收起,点开显示统计行+口径行) */
  .fs-infobar { display: none; flex: none; border-top: 1px solid var(--border-soft); margin-top: 8px; }
  .fs-infobar > summary {
    display: inline-block; cursor: pointer; list-style: none;
    font: 500 11.5px var(--font-mono); color: var(--muted);
    padding: 8px 2px; user-select: none;
  }
  .fs-infobar > summary:hover { color: var(--ink); }
  .fs-infobar > summary::-webkit-details-marker { display: none; }
  .fs-infobar > summary .caret::before { content: '▸ '; }
  .fs-infobar[open] > summary .caret::before { content: '▾ '; }
  .fs-infobar-body { max-height: 34vh; overflow: auto; padding-bottom: 8px; }

  /* 全屏按钮态（激活时深底,与叠加 chip 一致语汇) */
  #btnFs.is-active, #btnMeasure.is-active { background: var(--dark); color: var(--on-dark); border-color: var(--dark); }
  #btnMeasure:disabled { color: var(--ghost); cursor: not-allowed; opacity: .6; }
  #btnMeasure:disabled:hover { background: var(--field-bg); color: var(--ghost); border-color: var(--border-line); }

  /* F2 测量覆盖层:绝对定位在 .chart-stage 内;仅测量态拦截指针 */
  .measure-layer { position: absolute; inset: 0; z-index: 20; cursor: crosshair; display: none; }
  .chart-stage.is-measuring .measure-layer { display: block; }
  .measure-rect {
    position: absolute; pointer-events: none; display: none;
    background: rgba(90,110,150,0.12); border: 1px solid rgba(90,110,150,0.55);
  }
  .measure-hint {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    pointer-events: none; font: 500 11px var(--font-mono); color: var(--muted);
    background: var(--field-bg); border: 1px solid var(--border-line);
    border-radius: var(--r-xs); padding: 4px 10px; white-space: nowrap; z-index: 21;
  }
  .measure-card {
    position: absolute; pointer-events: none; display: none; z-index: 22;
    background: rgba(20,23,29,0.94); color: var(--on-dark);
    border: 1px solid var(--dark-border); border-radius: var(--r-md);
    padding: 8px 11px; font: 500 11.5px var(--font-mono); line-height: 1.7;
    white-space: nowrap; box-shadow: 0 4px 18px rgba(13,17,23,.35);
  }
  .measure-card .mc-hd { color: var(--on-dark-faint); font-size: 10.5px; }
  .measure-card .mc-big { font-size: 13px; font-weight: 600; }
  /* D1:涨跌值不用绿/红引导贵贱——统一中性墨色(on-dark),方向由 ↑↓ 箭头表达（事实方向，颜色不引导） */
  .measure-card .mc-up,
  .measure-card .mc-dn { color: var(--on-dark); }
  .measure-card .mc-sub { color: var(--on-dark-muted); }

  /* 导出弹层画布尺寸（预览）——必须是精确 16:9 / 9:16：
     ECharts 路径按 pixelRatio 从此尺寸放大，比例不精确会输出 1920×1078 之类的非标 PNG */
  .export-canvas-16 { width: 800px; height: 450px; }
  .export-canvas-9  { width: 270px; height: 480px; }

  /* —— ≤900px：左列表折叠为顶部横向滚动 chips，其余纵排 —— */
  @media (max-width: 900px) {
    .workbench { grid-template-columns: 1fr; gap: 14px; }
    .side { position: static; flex-direction: row; overflow-x: auto; gap: 16px; padding: 10px 12px; }
    .m-group { flex: none; flex-direction: row; align-items: center; gap: 8px; }
    .m-group-title { padding: 0; }
    .m-group-items { flex-direction: row; gap: 6px; }
    .m-item { width: auto; white-space: nowrap; border: 1px solid var(--border-line); border-radius: var(--r-pill); padding: 6px 12px; }
    .m-item.is-active { border-color: var(--dark); }
    .ctrls { margin-left: 0; }
    .chart-stage { height: 340px; }
  }

  /* ===== 扩产时间线视图（作为指标嵌入主图区，fab- 前缀避免与主图样式冲突） ===== */
  .fab-view { --fablabw:240px; }
  .fab-head-row { display:flex; align-items:flex-start; gap:16px; margin-bottom:4px; }
  .fab-toggle { margin-left:auto; flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none; color:var(--muted); font-size:12.5px; white-space:nowrap; padding-top:2px; }
  .fab-toggle input { accent-color:var(--co-samsung); width:14px; height:14px; }
  .fab-intro { color:var(--muted); font-size:12.5px; line-height:1.65; margin:0 0 12px; }
  .fab-intro b { color:var(--ink); font-weight:700; }
  .fab-legend { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; margin-bottom:16px; font-size:12px; color:var(--muted); }
  .fab-lg { display:inline-flex; align-items:center; gap:6px; }
  .fab-sw { width:22px; height:11px; border-radius:3px; display:inline-block; }
  /* 进度示意 swatch：左半实心=已推进，右半斜纹=剩余（与实际条形一致，用 Micron 蓝举例） */
  .fab-prog { width:40px; height:11px; border-radius:3px; display:inline-block; position:relative; overflow:hidden; background:rgba(46,111,230,.14); vertical-align:middle; }
  .fab-prog::before { content:''; position:absolute; left:0; top:0; bottom:0; width:52%; background:var(--co-mu); border-radius:3px 0 0 3px; }
  .fab-prog::after { content:''; position:absolute; left:52%; right:0; top:0; bottom:0; background-image:repeating-linear-gradient(45deg,var(--co-mu) 0 3px,transparent 3px 6px); opacity:.5; }
  .fab-today-sw { width:0; height:13px; border-left:2px dashed var(--loss); display:inline-block; vertical-align:middle; }
  .fab-co-block { margin-bottom:22px; }
  .fab-co-block:last-child { margin-bottom:0; }
  .fab-co-head { display:flex; align-items:center; gap:9px; margin:0 0 9px; }
  .fab-co-head .fab-dot { width:11px; height:11px; border-radius:50%; }
  .fab-co-head h3 { font-size:15.5px; margin:0; font-weight:800; }
  .fab-co-head .fab-cnt { font-size:11.5px; color:var(--faint); font-weight:500; }
  .fab-gantt { position:relative; border:1px solid var(--border); border-radius:12px; background:var(--card); overflow:hidden; }
  .fab-axis { position:relative; height:24px; margin-left:var(--fablabw); border-bottom:1px solid var(--border-soft); background:var(--field-bg); }
  .fab-yr { position:absolute; top:0; height:100%; display:flex; align-items:center; font-size:10.5px; color:var(--faint); font-family:'IBM Plex Mono',monospace; padding-left:5px; border-left:1px solid var(--border-soft); }
  .fab-row { position:relative; display:flex; align-items:stretch; border-top:1px solid var(--row-line); min-height:44px; }
  .fab-row.is-fd { background:var(--subcard-bg); }
  .fab-row-lab { width:var(--fablabw); flex:0 0 var(--fablabw); box-sizing:border-box; padding:8px 12px 8px 14px; border-right:1px solid var(--border-soft); }
  .fab-nm { font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.35; }
  .fab-meta { margin-top:3px; display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; }
  .fab-tag { font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:4px; letter-spacing:.2px; white-space:nowrap; }
  .fab-tag.storage { background:rgba(46,111,230,.10); color:#2258b8; }
  .fab-tag.packaging { background:rgba(14,140,140,.12); color:#0b6d6d; }
  .fab-tag.foundry { background:rgba(138,143,155,.15); color:#5c6470; }
  .fab-tag.loc { background:var(--field-bg); color:var(--faint); font-weight:600; border:1px solid var(--border-soft); }
  .fab-src { font-size:10px; color:var(--link); text-decoration:none; font-weight:600; }
  .fab-src:hover { text-decoration:underline; }
  .fab-lowconf { font-size:9px; color:var(--tier-b); font-weight:700; }
  .fab-status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex:0 0 auto; }
  .fab-track { position:relative; flex:1; min-width:0; }
  .fab-bar { position:absolute; top:50%; transform:translateY(-50%); height:16px; border-radius:5px; box-shadow:0 1px 2px rgba(20,23,29,.08); }
  .fab-fill { position:absolute; left:0; top:0; bottom:0; border-radius:5px 0 0 5px; }
  /* 剩余(今→投产)段：公司色斜纹，left 由内联设为已推进比例 fe% */
  .fab-rem { position:absolute; right:0; top:0; bottom:0; border-radius:0 5px 5px 0; background-image:repeating-linear-gradient(45deg, currentColor 0 3px, transparent 3px 6px); opacity:.5; }
  .fab-bar.full .fab-rem { display:none; }
  .fab-bar.full .fab-fill { border-radius:5px; }
  .fab-cap { position:absolute; font-size:10px; font-family:'IBM Plex Mono',monospace; white-space:nowrap; color:var(--faint); top:50%; transform:translateY(-50%); }
  .fab-cap.s { right:calc(100% + 6px); }
  .fab-cap.e { left:calc(100% + 6px); }
  .fab-cap.e b { color:var(--muted); font-weight:600; }
  .fab-bar.open { border-radius:5px; }
  .fab-bar.open::after { content:'▸'; position:absolute; right:-13px; top:50%; transform:translateY(-50%); font-size:11px; }
  .fab-diamond { position:absolute; top:50%; width:12px; height:12px; transform:translate(-50%,-50%) rotate(45deg); border-radius:2px; box-shadow:0 1px 2px rgba(20,23,29,.12); }
  .fab-diamond-cap { position:absolute; top:50%; transform:translateY(-50%); font-size:10px; font-family:'IBM Plex Mono',monospace; color:var(--faint); }
  .fab-today-wrap { position:absolute; left:var(--fablabw); right:0; top:24px; bottom:0; pointer-events:none; z-index:3; }
  .fab-today { position:absolute; top:0; bottom:0; width:0; border-left:2px dashed var(--loss); }
  .fab-today-lab { position:absolute; top:-20px; left:-15px; font-size:10px; font-weight:700; color:var(--loss); font-family:'IBM Plex Mono',monospace; }
  .fab-tbd { margin-top:12px; }
  .fab-tbd h4 { font-size:12px; color:var(--faint); font-weight:700; margin:0 0 8px; }
  .fab-tbd-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }

  if (x == null || !isFinite(x)) return '—';

/* F2:公司色变暗（hex 各通道 ×(1-pct)）——叠加指标序列用深色变体与主指标区分 */
function shade(color, pct) {
  const m = /^#([0-9a-fA-F]{6})$/.exec(String(color || ''));
  if (!m) return color;
  const n = parseInt(m[1], 16);
  const ch = (x) => Math.max(0, Math.min(255, Math.round(x * (1 - pct))));
  return '#' + ((1 << 24) | (ch((n >> 16) & 255) << 16) | (ch((n >> 8) & 255) << 8) | ch(n & 255))
    .toString(16).slice(1);
}
const OVERLAY_SHADE = 0.42;
/* 变亮（向白混合）：深色导出底上叠加线用——变暗在浅底是增对比、在深底是减对比，方向相反 */
function tint(color, pct) {
  const m = /^#([0-9a-fA-F]{6})$/.exec(String(color || ''));
  if (!m) return color;
  const n = parseInt(m[1], 16);
  const ch = (x) => Math.max(0, Math.min(255, Math.round(x + (255 - x) * pct)));
  return '#' + ((1 << 24) | (ch((n >> 16) & 255) << 16) | (ch((n >> 8) & 255) << 8) | ch(n & 255))
    .toString(16).slice(1);
}
function overlayColor(baseColor, dark) {
  return dark ? tint(baseColor, 0.38) : shade(baseColor, OVERLAY_SHADE);
}

  if (cur === 'KRW') {
    const t = v / 1e12;
    return (Math.abs(t) >= 100 ? t.toFixed(0) : Math.abs(t) >= 1 ? t.toFixed(1) : t.toFixed(2)) + '조 KRW';
  }
  const b = v / 1e9;
  if (Math.abs(b) >= 1) return '$' + (Math.abs(b) >= 100 ? b.toFixed(0) : b.toFixed(1)) + 'B';
  return '$' + Math.round(v / 1e6) + 'M';
}
function moneyAxis(v, cur) {
  if (v == null || !isFinite(v)) return '';
  if (cur === 'KRW') {
    const t = v / 1e12;
    return (Math.abs(t) >= 10 ? Math.round(t) : Math.round(t * 10) / 10) + '조';
  }
  const b = v / 1e9;
  if (Math.abs(b) >= 1) return '$' + (Math.abs(b) >= 10 ? Math.round(b) : Math.round(b * 10) / 10) + 'B';
  return '$' + Math.round(v / 1e6) + 'M';
}

  if (v == null || !isFinite(v)) return '—';
  if (cur === 'KRW') return '₩' + Math.round(v).toLocaleString('en-US');
  return '$' + (v >= 100 ? Math.round(v).toLocaleString('en-US') : v.toFixed(2));
}
/* 统计行值格式化（按指标 kind + 公司币种） */
function fmtVal(m, v, cur) {
  if (v == null || !isFinite(v)) return '—';
  if (m.kind === 'ratio') return v >= 100 ? v.toFixed(0) : v.toFixed(2);
  if (m.kind === 'pct')   return (v * 100).toFixed(1) + '%';
  if (m.kind === 'days')  return Math.round(v) + ' 天';
  if (m.kind === 'money') return moneyFmt(v, cur);
  if (m.kind === 'price') return priceFmt(v, cur);
  return String(v);
}
function tooltipFmt(m, v, cur) {
  if (v == null) return '—';
  if (m.kind === 'pct')   return (v * 100).toFixed(1) + '%';
  if (m.kind === 'days')  return Math.round(v) + ' 天';
  if (m.kind === 'money') return moneyFmt(v, cur);
  return String(v);
}

/* ---------- 数据整形（schema 0.6；任何字段都可能缺，统一空值化） ---------- */
function transform(raw) {
  const companies = Array.isArray(raw.companies) ? raw.companies : [];
  const valuation = (raw.valuation && typeof raw.valuation === 'object') ? raw.valuation : {};
  return companies.map((cfg) => {
    const ticker = cfg && cfg.ticker ? cfg.ticker : '';
    const v = valuation[ticker] || {};
    const ql = (Array.isArray(v.quarterly_long) ? v.quarterly_long : []).filter((q) => q && q.period_end);
    const take = (f) => ql.map((q) => (q && q[f] != null ? q[f] : null));
    const seq = (o, f) => (o && Array.isArray(o[f])) ? o[f] : [];
    return {
      ticker,
      name: (cfg && cfg.name) || ticker,
      color: (cfg && cfg.color) || COMPANY_COLORS[ticker] || '#5C6470',
      currency: v.currency || (cfg && cfg.currency) || '',
      selfCalc: !!v.is_self_calculated,
      groupScope: !!v.is_group_scope,
      daily:  { dates: seq(v.daily, 'dates'), pe: seq(v.daily, 'pe'), pb: seq(v.daily, 'pb') },
      priceD: { dates: seq(v.price_daily, 'dates'), close: seq(v.price_daily, 'close') },
      // W11·F1:Forward P/E（分析师一致预期，非历史事实）——仅 pe 视图图下标注块用，不入曲线
      forwardPe: (v.forward_pe && typeof v.forward_pe === 'object') ? v.forward_pe : null,
      // F3:该公司财报既定事实区间（亏损期/营收收缩期）+ definitions 原文
      bands: (v.bands && typeof v.bands === 'object') ? v.bands : null,
      longDates: ql.map((q) => q.period_end),
      q: {
        revenue: take('revenue'), rev_yoy: take('rev_yoy'),
        gross_margin: take('gross_margin'), op_margin: take('op_margin'), net_margin: take('net_margin'),
        dio: take('dio'),
        // capex 为现金流出，展示取绝对值（口径行注明）
        capex: ql.map((q) => (q && q.capex != null ? Math.abs(q.capex) : null)),
        capex_to_rev: take('capex_to_rev'),
        pe: take('pe'), pb: take('pb'),
      },
      stats: (v.stats && typeof v.stats === 'object') ? v.stats : {},
      splice: (v.long_meta && v.long_meta.splice) ? v.long_meta.splice : null,
      // 热身桥接披露:季度 TTM 暖机期(拼接口缺连续4季)以最近年报净利作尾随 P/E 分母的跨度
      peBridge: (v.long_meta && Array.isArray(v.long_meta.pe_bridge)) ? v.long_meta.pe_bridge : [],
    };
  });
}

/* 按指标 + 范围取一家的序列（dates/values 等长；null=真缺口不插值） */
function seriesFor(c, m, range) {
  if (m.key === 'price') {
    // 股价只有全史日频一种（月频股价字段已从 schema 删除）
    return { dates: c.priceD.dates, values: c.priceD.close };
  }
  if (m.key === 'pe' || m.key === 'pb') {
    if (range === 'long') return { dates: c.longDates, values: c.q[m.key] };
    return { dates: c.daily.dates, values: c.daily[m.key] };
  }
  return { dates: c.longDates, values: c.q[m.key] || [] };
}

/* ======================================================================
   F3 「历史周期」带 —— bands 为构建器从该公司自身财报算出的既定事实区间
   （亏损期=营业利润率<0 连续季度；营收收缩期=营收同比<0 连续季度），
   不构成周期判断。恰好 1 家公司激活且该家 bands 存在才可用；开启后当前
   指标图（含叠加态）一律走 ECharts 渲染（markArea），关闭恢复原 LWC 路径。
   ====================================================================== */
function bandCompany() {
  const list = activeCompanies();
  return (list.length === 1 && list[0].bands) ? list[0] : null;
}

const BAND_STYLES = [
  // 收缩带先画、亏损带后画（嵌套时亏损带在收缩带之上）
  { key: 'rev_contraction', color: 'rgba(240,180,41,0.10)', label: '营收收缩', labelColor: 'rgba(158,116,10,0.85)' },
  { key: 'loss',            color: 'rgba(229,72,77,0.08)',  label: '亏损期',   labelColor: 'rgba(191,54,60,0.85)' },
];
// 交集带（营收收缩 ∩ 亏损期）：两个单带都很淡，重叠处混色看不清 → 用更深的
// 红棕单独画在最上层，让「既收缩又亏损」（周期最深段）一眼可辨。纯事实标记，无判断。
const OVERLAP_STYLE = { color: 'rgba(150,34,44,0.32)', label: '收缩＋亏损', labelColor: 'rgba(140,28,38,0.95)' };

/* markArea 数据：时间轴直接用 from/to（超出图数据范围由 ECharts 自然裁剪）；
   类目轴（金额柱状）把 from/to 映射到区间内实际类目值，映射不到则跳过 */
function bandMarkArea(c, catDates) {
  const bands = (c && c.bands) || {};
  const data = [];
  // 生成一个 markArea 项（含零宽保护 / 类目轴映射 / 年度标签 / 分行错开）
  const pushSeg = (rawFrom, rawTo, st, isManual, rowOffset) => {
    let from = rawFrom, to = rawTo;
    // 零宽保护（时间轴）：from>=to 会画成零宽矩形（带不可见、只剩悬空 label），
    // 回退约一季长度（91 天）以覆盖整季
    if (!catDates && from >= to) {
      const t = new Date(to + 'T00:00:00Z');
      t.setUTCDate(t.getUTCDate() - 91);
      from = t.toISOString().slice(0, 10);
    }
    if (catDates) {
      const inR = catDates.filter((d) => d >= rawFrom && d <= rawTo);
      if (!inR.length) return;
      from = inR[0]; to = inR[inR.length - 1];
    }
    data.push([
      { xAxis: from, name: st.label + (isManual ? '·年度' : ''),
        itemStyle: { color: st.color, opacity: isManual ? 0.8 : 1 },
        label: { show: true, position: 'insideTop', offset: [0, rowOffset],
                 fontSize: 9.5, color: st.labelColor, fontFamily: FONT_SANS } },
      { xAxis: to },
    ]);
  };
  // ① 收缩带（第 1 行标签）② 亏损带（第 2 行标签，常嵌在收缩带内）
  BAND_STYLES.forEach((st) => {
    (Array.isArray(bands[st.key]) ? bands[st.key] : []).forEach((seg) => {
      if (!seg || !seg.from || !seg.to) return;
      pushSeg(seg.from, seg.to, st, seg.method === 'manual-annual', st.key === 'loss' ? 15 : 0);
    });
  });
  // ③ 交集带（收缩 ∩ 亏损）：最后画=最上层，深色盖过下方两淡带混色（第 3 行标签）。
  //    日期为 YYYY-MM-DD，可直接字典序比较求交集；from>=to（无交集或零宽）跳过。
  const losses = Array.isArray(bands.loss) ? bands.loss : [];
  const contras = Array.isArray(bands.rev_contraction) ? bands.rev_contraction : [];
  losses.forEach((L) => contras.forEach((C) => {
    if (!L.from || !L.to || !C.from || !C.to) return;
    const from = L.from > C.from ? L.from : C.from;
    const to = L.to < C.to ? L.to : C.to;
    if (from >= to) return;   // 无实质重叠
    const isManual = L.method === 'manual-annual' || C.method === 'manual-annual';
    pushSeg(from, to, OVERLAP_STYLE, isManual, 30);
  }));
  return data.length ? { silent: true, data } : null;
}

/* 周期带挂到 option 第一条 series（一条 markArea 内按数组顺序后画者在上） */
function attachBands(opt, c, catDates) {
  if (!opt || !Array.isArray(opt.series) || !opt.series.length) return opt;
  const ma = bandMarkArea(c, catDates);
  if (ma) opt.series[0].markArea = ma;
  return opt;
}

/* 单指标 price/pe/pb 开启周期带时的 ECharts 渲染：日频数组直接给 time 轴
   （sampling:'lttb'、不画符号）；pe/price 对数轴（log 轴不吃 ≤0——pe 的 NM
   已为 null 断开、price 恒正）、pb 线性轴 */
function ecBandLineOption(m, c) {
  const range = rangeVal(m);
  const s = seriesFor(c, m, range);
  const daily = m.key === 'price' || (!!m.hasRange && range === 'daily');
  const fs = 11.5;
  const opt = {
    animation: true,
    textStyle: { fontFamily: FONT_SANS },
    grid: { left: 58, right: 26, top: 30, bottom: 30 },
    tooltip: {
      trigger: 'axis', confine: true, textStyle: { fontSize: 12 },
      valueFormatter: (v) => fmtVal(m, v, c.currency),
    },
    xAxis: {
      type: 'time',
      axisLine: { lineStyle: { color: axLine(false) } },
      axisTick: { show: false },
      axisLabel: {
        color: axText(false), fontSize: fs, fontFamily: FONT_MONO,
        formatter: { year: '{yyyy}', month: '{yyyy}-{MM}', day: '{yyyy}-{MM}' },
      },
      splitLine: { show: false },
    },
    yAxis: {
      type: m.log ? 'log' : 'value',
      axisLabel: {
        color: axText(false), fontSize: fs, fontFamily: FONT_MONO,
        // 股价轴紧凑格式:韩元价可达 7 位数,原样输出会撑爆/裁掉轴标签
        formatter: m.kind === 'price'
          ? (v) => (v >= 1e6 ? (v / 1e6) + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'k' : v)
          : undefined,
      },
      splitLine: { lineStyle: { color: axLine(false) } },
    },
    series: [{
      name: c.name, type: 'line',
      data: s.dates.map((d, i) => [d, s.values[i]]),
      connectNulls: false, symbol: 'circle', showSymbol: false, symbolSize: 0,
      sampling: daily ? 'lttb' : undefined,
      lineStyle: { width: daily ? 1.6 : 2 }, color: c.color,
    }],
    dataZoom: [{ type: 'inside' }],
  };
  return attachBands(opt, c, null);
}

/* ======================================================================
   图表实例管理
   —— ECharts：charts 表，按 key init/dispose。
   —— LWC：lwcCache（key → {ctrl, box}）+ 在途 Promise 缓存 + 世代令牌。
   ====================================================================== */
let echarts = null;
const charts = {};

/* ======================================================================
   W10 · F3 十字光标数值面板（统一）—— 所有 ECharts 图补 axis 十字 + 数值 tooltip。
   在 renderChart 单一入口给 option.tooltip 挂 axisPointer:{type:'cross'} 与顶层
   axisPointer 十字线样式（mono 字体、深色卡、confine 已在各 option 内)。
   markArea(周期带 silent)不干扰;不新增任何判断性内容,只呈现数值。
   ====================================================================== */
const CROSS_LINE = { color: '#9AA3B2', width: 1, type: 'dashed' };
function withCrosshair(option) {
  if (!option || typeof option !== 'object') return option;
  // 顶层 axisPointer:十字线视觉（label 深底 mono,与 LWC 浮框对齐)
  if (!option.axisPointer) {
    option.axisPointer = {
      link: [{ xAxisIndex: 'all' }],
      lineStyle: CROSS_LINE,
      crossStyle: CROSS_LINE,
      label: {
        backgroundColor: '#3A404B', color: '#F2F4F8',
        fontFamily: FONT_MONO, fontSize: 11, padding: [3, 6],
      },
    };
  }
  // tooltip:确保 trigger:'axis' + axisPointer:{type:'cross'} + mono 深色卡 + confine
  const tips = Array.isArray(option.tooltip) ? option.tooltip : (option.tooltip ? [option.tooltip] : []);
  tips.forEach((tp) => {
    if (!tp || typeof tp !== 'object') return;
    if (!tp.trigger) tp.trigger = 'axis';
    if (!tp.axisPointer) tp.axisPointer = { type: 'cross', crossStyle: CROSS_LINE, lineStyle: CROSS_LINE };
    else if (!tp.axisPointer.type) tp.axisPointer.type = 'cross';
    if (tp.confine == null) tp.confine = true;
    tp.backgroundColor = tp.backgroundColor || 'rgba(20,23,29,0.94)';
    tp.borderColor = tp.borderColor || '#262C38';
    tp.textStyle = Object.assign({ color: '#F2F4F8', fontFamily: FONT_MONO }, tp.textStyle || {});
  });
  return option;
}

function renderChart(key, el, option) {
  if (!echarts || !el || !option) return;
  withCrosshair(option);
  if (!charts[key]) charts[key] = echarts.init(el);
  charts[key].setOption(option, true);
  charts[key].resize();
}
function disposeChart(key) {
  if (charts[key]) { try { charts[key].dispose(); } catch (e) {} delete charts[key]; }
}
function disposeSmallEc() {
  Object.keys(charts).forEach((k) => { if (k.indexOf('ecsm') === 0) disposeChart(k); });
}

const lwcCache = {};      // 'ov-<metric>-<range>' | 'sm-…' → { ctrl, box }
const lwcPending = {};    // 在途 Promise 缓存（防快速切换并发重复建图）
let smallGen = 0;         // 小多图世代令牌
let elLwcMain, elEcMain, elLwcSmall, elEcSmall, elChartNote;

function ovKey(m, range) { return 'ov-' + m.key + '-' + range; }

function hideOverlayLwcBoxes() {
  Object.keys(lwcCache).forEach((k) => {
    if (k.indexOf('ov-') === 0) lwcCache[k].box.style.display = 'none';
  });
}
function removeSmallLwc() {
  smallGen++;   // 令在途的小多图建图循环过期
  Object.keys(lwcCache).forEach((k) => {
    if (k.indexOf('sm-') === 0) { lwcCache[k].ctrl.remove(); delete lwcCache[k]; }
  });
}

/* 叠加大图（LWC）：按 metric×range 建一次缓存复用；在途 Promise 防并发 */
function ensureOverlayLwc(m, range) {
  const key = ovKey(m, range);
  if (lwcCache[key]) return Promise.resolve(lwcCache[key]);
  if (lwcPending[key]) return lwcPending[key];
  const box = document.createElement('div');
  elLwcMain.appendChild(box);
  const series = state.companies.map((c) => {
    const s = seriesFor(c, m, range);
    return { name: c.name, color: c.color, dates: s.dates, values: s.values };
  });
  lwcPending[key] = createSeriesChart(box, { series, log: !!m.log })
    .then((ctrl) => { lwcCache[key] = { ctrl, box }; delete lwcPending[key]; return lwcCache[key]; })
    .catch(() => { delete lwcPending[key]; box.remove(); return null; });
  return lwcPending[key];
}

async function renderOverlayLwc(m, range) {
  const key = ovKey(m, range);
  const entry = await ensureOverlayLwc(m, range);
  const cm = curMetric();
  const stillHere = cm.lib === 'lwc' && effMode(cm) === 'overlay' && ovKey(cm, rangeVal(cm)) === key;
  if (!entry) {
    // LWC 库加载失败（双 CDN 均挂）：占位不留白；缓存里的 box 已随之失效，一并清掉
    if (stillHere) {
      Object.keys(lwcCache).forEach((k) => { if (k.indexOf('ov-') === 0) delete lwcCache[k]; });
      elLwcMain.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;font:500 12.5px var(--font-mono);color:var(--ghost)">图表组件加载失败（Lightweight Charts CDN）— 刷新重试</div>';
    }
    return;
  }
  // 并发守卫：await（首次 CDN 加载）期间用户可能已切指标/范围/模式——
  // 过期续体只隐藏自己那张，显隐交给最新续体。
  if (!stillHere) { entry.box.style.display = 'none'; return; }
  Object.keys(lwcCache).forEach((k) => {
    if (k.indexOf('ov-') === 0) lwcCache[k].box.style.display = (k === key) ? 'block' : 'none';
  });
  state.companies.forEach((c) => entry.ctrl.setVisible(c.name, !!state.active[c.ticker]));
  entry.ctrl.fit();
  // W10 F2:异步 LWC 建图完成后校准测量按钮可用态与覆盖层
  // （首帧 render 时 lwcCache 尚未就绪,measurableView 会误判不可测量而置灰)
  syncMeasureUI();
}

/* 小多图（LWC）：每次重铺；世代令牌防在途循环把旧图叠进新一轮 */
async function renderSmallLwc(m, range) {
  removeSmallLwc();
  const gen = smallGen;
  const list = activeCompanies();
  elLwcSmall.innerHTML = list.map((c, i) => {
    const sub = m.key === 'price' ? ' · ' + esc(c.currency) : '';
    return '<div class="small-cell"><div class="cell-head" style="color:' + esc(c.color) + '">'
      + esc(c.name) + sub + '</div><div class="chart-small" id="lwcSm' + i + '"></div></div>';
  }).join('');
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    const cell = document.getElementById('lwcSm' + i);
    if (!cell) continue;
    const s = seriesFor(c, m, range);
    if (!hasAnyVal(s.values)) { cell.innerHTML = '<div class="cell-note">无数据</div>'; continue; }
    let ctrl;
    try {
      ctrl = await createSeriesChart(cell, {
        series: [{ name: c.name, color: c.color, dates: s.dates, values: s.values }],
        log: !!m.log,
      });
    } catch (e) {
      cell.innerHTML = '<div class="cell-note">图表组件加载失败</div>';
      continue;
    }
    // 世代守卫：await 期间若已发生新一轮清理/重铺，销毁刚建的图并退出
    if (gen !== smallGen) { ctrl.remove(); return; }
    ctrl.fit();
    lwcCache['sm-' + m.key + '-' + range + '-' + c.ticker] = { ctrl, box: cell };
  }
}

/* ======================================================================
   ECharts option 工厂（时间轴/类目轴；connectNulls:false；负值红点仅 margins/yoy）
   ====================================================================== */
const axText  = (dark) => (dark ? '#9AA3B2' : C.faint);
const axLine  = (dark) => (dark ? '#232936' : C.softLine);

function axisFmtFor(m, cur) {
  if (m.kind === 'pct')   return (v) => Math.round(v * 100) + '%';
  if (m.kind === 'money') return (v) => moneyAxis(v, cur);
  return undefined;
}

/* 折线（时间轴，季度长序列）：叠加（only=null，取激活公司）或单家（only=c） */
function ecLineOption(m, dark, only) {
  const fs = dark ? 13 : 11.5;
  const list = only ? [only] : activeCompanies();
  const series = [];
  list.forEach((c, ci) => {
    const s = seriesFor(c, m, 'q');
    const data = s.dates.map((d, i) => {
      const val = s.values[i];
      if (m.negRed) {
        // 负值点标红：负值=亏损/负增长是数据事实（不加阴影、不加文字标签）
        return {
          value: [d, val],
          itemStyle: (val != null && val < 0) ? { color: C.loss, borderColor: C.loss } : { color: c.color },
        };
      }
      return [d, val];
    });
    const ser = {
      name: c.name, type: 'line', data,
      connectNulls: false,                        // 真缺口断开，不插值
      symbol: 'circle',
      showSymbol: !!m.negRed,
      symbolSize: m.negRed ? (dark ? 7 : 4.5) : 0,
      lineStyle: { width: dark ? 2.6 : 2 },
      color: c.color,
    };
    if (ci === 0 && m.zeroLine) {
      ser.markLine = {
        silent: true, symbol: 'none', label: { show: false },
        lineStyle: { color: dark ? '#3A4356' : '#C9CED6', width: 1, type: 'solid' },
        data: [{ yAxis: 0 }],
      };
    }
    series.push(ser);
  });
  const opt = {
    animation: !dark,
    textStyle: { fontFamily: FONT_SANS },
    grid: { left: 58, right: 26, top: only ? 38 : 26, bottom: 30 },
    tooltip: {
      trigger: 'axis', confine: true, textStyle: { fontSize: 12 },
      valueFormatter: (v) => tooltipFmt(m, v, only ? only.currency : ''),
    },
    xAxis: {
      type: 'time',
      axisLine: { lineStyle: { color: axLine(dark) } },
      axisTick: { show: false },
      axisLabel: {
        color: axText(dark), fontSize: fs, fontFamily: FONT_MONO,
        formatter: { year: '{yyyy}', month: '{yyyy}-{MM}', day: '{yyyy}-{MM}' },
      },
      splitLine: { show: false },
    },
    yAxis: {
      type: 'value',
      axisLabel: { color: axText(dark), fontSize: fs, fontFamily: FONT_MONO, formatter: axisFmtFor(m, only ? only.currency : '') },
      splitLine: { lineStyle: { color: axLine(dark) } },
    },
    series,
  };
  if (!dark) opt.dataZoom = [{ type: 'inside' }];   // 原生拖拽缩放，无预设区间按钮
  if (only) {
    opt.title = {
      text: only.name, left: 6, top: 0,
      textStyle: { fontSize: 13, fontWeight: 700, color: only.color, fontFamily: FONT_SANS },
    };
  }
  return opt;
}

/* 柱状（类目轴，季度长序列，单家一图）：revenue / capex（金额类，独立成图标币种） */
function ecBarOption(m, c, dark) {
  const s = seriesFor(c, m, 'q');
  const fs = dark ? 11 : 10.5;
  const opt = {
    animation: !dark,
    textStyle: { fontFamily: FONT_SANS },
    title: {
      text: c.name + ' · ' + c.currency, left: 6, top: 0,
      textStyle: { fontSize: 12.5, fontWeight: 700, color: c.color, fontFamily: FONT_SANS },
    },
    grid: { left: 56, right: 14, top: 34, bottom: 28 },
    tooltip: {
      trigger: 'axis', confine: true, textStyle: { fontSize: 11.5 },
      valueFormatter: (v) => moneyFmt(v, c.currency),
    },
    xAxis: {
      type: 'category', data: s.dates,
      axisLine: { lineStyle: { color: axLine(dark) } },
      axisTick: { show: false },
      axisLabel: { color: axText(dark), fontSize: fs, fontFamily: FONT_MONO, formatter: (v) => String(v).slice(0, 4) },
    },
    yAxis: {
      type: 'value',
      axisLabel: { color: axText(dark), fontSize: fs, fontFamily: FONT_MONO, formatter: (v) => moneyAxis(v, c.currency) },
      splitLine: { lineStyle: { color: axLine(dark) } },
    },
    series: [{ type: 'bar', name: c.name, data: s.values, itemStyle: { color: c.color }, barMaxWidth: 14 }],
  };
  if (!dark) opt.dataZoom = [{ type: 'inside' }];
  return opt;
}

/* ======================================================================
   A1 二指标叠加（统一走 ECharts；单指标视图完全不动）
   —— 无金额类组合：一张双轴图，主指标=左轴实线 / 叠加=右轴虚线，公司色不变。
   —— 含 revenue/capex：强制小多图，每家一格格内双轴（金额=柱·左，另一指标=虚线·右；
      双金额=左主柱/右叠柱，叠柱降不透明度区分——同为公司色，非估值语义色）。
   ====================================================================== */

/* 指标在当前 range 下是否日频（日频序列需 lttb 采样、不画符号；price 恒为全史日频） */
function comboIsDaily(met) { return met.key === 'price' || (!!met.hasRange && state.range === 'daily'); }

/* 组合序列数据：沿用单指标的 negRed 负值红点规则；[date, val] 时间轴对
   baseColor 缺省=公司色（F2:叠加序列传入深色变体保持符号同色） */
function comboSeriesData(met, c, s, baseColor) {
  const col = baseColor || c.color;
  return s.dates.map((d, i) => {
    const val = s.values[i];
    if (met.negRed) {
      return {
        value: [d, val],
        itemStyle: (val != null && val < 0) ? { color: C.loss, borderColor: C.loss } : { color: col },
      };
    }
    return [d, val];
  });
}

/* 双轴大图的一条折线：name=公司名·指标短名
   F2:叠加（虚线）序列颜色 = 变体色（浅底加深 / 深色导出底提亮），主指标（实线）公司色不变 */
function comboLineSeries(met, c, axisIdx, dashed, dark) {
  const s = seriesFor(c, met, rangeVal(met));
  const col = dashed ? overlayColor(c.color, dark) : c.color;
  const ser = {
    name: c.name + '·' + met.short,
    type: 'line', yAxisIndex: axisIdx,
    data: comboSeriesData(met, c, s, col),
    connectNulls: false,                        // 真缺口断开，不插值
    symbol: 'circle',
    showSymbol: !!met.negRed,
    symbolSize: met.negRed ? (dark ? 6.5 : 4.5) : 0,
    lineStyle: { width: dashed ? (dark ? 2.2 : 1.6) : (dark ? 2.6 : 2), type: dashed ? 'dashed' : 'solid' },
    color: col,
  };
  if (comboIsDaily(met)) { ser.sampling = 'lttb'; ser.showSymbol = false; }
  return ser;
}

/* 组合 tooltip：按 seriesIndex 找回指标与币种，各自单位格式化 */
function comboTooltip(metaByIndex) {
  return {
    trigger: 'axis', confine: true, textStyle: { fontSize: 12 },
    formatter: (params) => {
      const list = Array.isArray(params) ? params : [params];
      if (!list.length) return '';
      const raw = Array.isArray(list[0].value) ? list[0].value[0] : list[0].axisValue;
      let html = esc(typeof raw === 'number' ? new Date(raw).toISOString().slice(0, 10) : String(raw));
      list.forEach((p) => {
        const meta = metaByIndex[p.seriesIndex] || {};
        const v = Array.isArray(p.value) ? p.value[1] : p.value;
        html += '<br/>' + p.marker + esc(p.seriesName) + '&nbsp;&nbsp;<b>'
          + esc(fmtVal(meta.met || {}, v, meta.cur || '')) + '</b>';
      });
      return html;
    },
  };
}

/* 双轴叠加大图（组合不含金额类；log 指标其轴 type:'log'，维持现有对数轴约定） */
function ecComboOption(m, o, dark) {
  const fs = dark ? 13 : 11.5;
  const list = activeCompanies();
  const series = [];
  const metaByIndex = [];
  const pushSer = (met, axisIdx, dashed) => {
    list.forEach((c) => {
      series.push(comboLineSeries(met, c, axisIdx, dashed, dark));
      metaByIndex.push({ met, cur: c.currency });
    });
  };
  pushSer(m, 0, false);
  pushSer(o, 1, true);
  const yAx = (met, right) => ({
    type: met.log ? 'log' : 'value',
    position: right ? 'right' : 'left',
    name: met.short,
    nameTextStyle: { color: axText(dark), fontSize: fs - 1, fontFamily: FONT_MONO },
    axisLabel: { color: axText(dark), fontSize: fs, fontFamily: FONT_MONO, formatter: axisFmtFor(met, '') },
    splitLine: right ? { show: false } : { lineStyle: { color: axLine(dark) } },
  });
  const opt = {
    animation: !dark,
    textStyle: { fontFamily: FONT_SANS },
    grid: { left: 64, right: 64, top: 58, bottom: 30 },
    legend: {
      top: 0, left: 0, itemWidth: 20, itemHeight: 9,
      textStyle: { fontSize: 11, color: C.muted, fontFamily: FONT_SANS },
    },
    tooltip: comboTooltip(metaByIndex),
    xAxis: {
      type: 'time',
      axisLine: { lineStyle: { color: axLine(dark) } },
      axisTick: { show: false },
      axisLabel: {
        color: axText(dark), fontSize: fs, fontFamily: FONT_MONO,
        formatter: { year: '{yyyy}', month: '{yyyy}-{MM}', day: '{yyyy}-{MM}' },
      },
      splitLine: { show: false },
    },
    yAxis: [yAx(m, false), yAx(o, true)],
    series,
  };
  if (!dark) opt.dataZoom = [{ type: 'inside' }];
  return opt;
}

/* 金额组合的格内构成：金额=柱(左)、另一指标=虚线(右)；双金额=左主柱/右叠柱；
   ov 标记该槽位是否叠加指标（F2:叠加序列一律用公司色深变体） */
function comboCellPlan(m, o) {
  const mM = m.kind === 'money', oM = o.kind === 'money';
  if (mM && oM) return { left: { met: m, type: 'bar', faded: false }, right: { met: o, type: 'bar', faded: true, ov: true } };
  if (mM)       return { left: { met: m, type: 'bar', faded: false }, right: { met: o, type: 'line', faded: false, ov: true } };
  return               { left: { met: o, type: 'bar', faded: false, ov: true }, right: { met: m, type: 'line', faded: false } };
}

/* 格内一条序列（页内小多图与导出多 grid 共用；xi/yi=坐标系索引） */
function comboCellSeriesDef(slot, c, xi, yi, dark) {
  const met = slot.met;
  const s = seriesFor(c, met, rangeVal(met));
  const col = slot.ov ? overlayColor(c.color, dark) : c.color;   // F2:叠加=变体色(浅底加深/深底提亮)
  if (slot.type === 'bar') {
    return {
      name: met.short, type: 'bar', xAxisIndex: xi, yAxisIndex: yi,
      data: s.dates.map((d, i) => [d, s.values[i]]),
      itemStyle: { color: col, opacity: slot.faded ? 0.45 : 1 },
      barMaxWidth: 12,
    };
  }
  const ser = {
    name: met.short, type: 'line', xAxisIndex: xi, yAxisIndex: yi,
    data: comboSeriesData(met, c, s, col),
    connectNulls: false,
    symbol: 'circle',
    showSymbol: !!met.negRed,
    symbolSize: met.negRed ? (dark ? 6 : 4) : 0,
    lineStyle: { width: dark ? 2 : 1.6, type: 'dashed' },
    color: col,
  };
  if (comboIsDaily(met)) { ser.sampling = 'lttb'; ser.showSymbol = false; }
  return ser;
}

/* 金额组合小多图的一格（格标题=公司名·币种，格内双轴） */
function ecComboCellOption(m, o, c, dark) {
  const plan = comboCellPlan(m, o);
  const fs = dark ? 11 : 10.5;
  const metaByIndex = [{ met: plan.left.met, cur: c.currency }, { met: plan.right.met, cur: c.currency }];
  const yAx = (slot, right) => ({
    type: slot.met.log ? 'log' : 'value',
    position: right ? 'right' : 'left',
    axisLabel: { color: axText(dark), fontSize: fs, fontFamily: FONT_MONO, formatter: axisFmtFor(slot.met, c.currency) },
    splitLine: right ? { show: false } : { lineStyle: { color: axLine(dark) } },
  });
  const opt = {
    animation: !dark,
    textStyle: { fontFamily: FONT_SANS },
    title: {
      text: c.name + ' · ' + c.currency, left: 6, top: 0,
      textStyle: { fontSize: 12.5, fontWeight: 700, color: c.color, fontFamily: FONT_SANS },
    },
    legend: {
      top: 2, right: 2, itemWidth: 14, itemHeight: 8,
      textStyle: { fontSize: 10, color: axText(dark), fontFamily: FONT_SANS },
    },
    grid: { left: 56, right: 48, top: 34, bottom: 28 },
    tooltip: comboTooltip(metaByIndex),
    xAxis: {
      type: 'time',
      axisLine: { lineStyle: { color: axLine(dark) } },
      axisTick: { show: false },
      axisLabel: {
        color: axText(dark), fontSize: fs, fontFamily: FONT_MONO,
        formatter: { year: '{yyyy}', month: '{yyyy}-{MM}', day: '{yyyy}-{MM}' },
      },
      splitLine: { show: false },
    },
    yAxis: [yAx(plan.left, false), yAx(plan.right, true)],
    series: [comboCellSeriesDef(plan.left, c, 0, 0, dark), comboCellSeriesDef(plan.right, c, 0, 1, dark)],
  };
  if (!dark) opt.dataZoom = [{ type: 'inside' }];
  return opt;
}

/* 叠加态渲染：ECharts 实例全部纳入 charts 表；LWC 容器全部隐藏 */
function renderComboCharts(m, o) {
  const list = activeCompanies();
  const money = m.kind === 'money' || o.kind === 'money';
  const anyData = state.companies.some((c) =>
    hasAnyVal(seriesFor(c, m, rangeVal(m)).values) || hasAnyVal(seriesFor(c, o, rangeVal(o)).values));

  elChartNote.hidden = true;
  const showNote = (msg) => { elChartNote.textContent = msg; elChartNote.hidden = false; };

  const ok = state.companies.length && anyData && list.length && !!echarts;
  elLwcMain.hidden  = true;
  elLwcSmall.hidden = true;
  elEcMain.hidden   = !(ok && !money);
  elEcSmall.hidden  = !(ok && money);

  if (!state.companies.length) { cleanupCharts(); showNote('无数据 — valuation.json 加载失败或为空'); return; }
  if (!anyData)                { cleanupCharts(); showNote('无数据 — 该指标在数据文件中缺失'); return; }
  if (!list.length)            { cleanupCharts(); showNote('未选择公司 — 点上方公司开关以显示图形'); return; }
  if (!echarts)                { cleanupCharts(); showNote('图表组件加载失败（ECharts CDN）— 刷新重试'); return; }

  hideOverlayLwcBoxes();
  removeSmallLwc(); elLwcSmall.innerHTML = '';

  const bc = state.bands ? bandCompany() : null;   // F3:叠加态同样可挂周期带
  if (!money) {
    disposeSmallEc(); elEcSmall.innerHTML = '';
    const opt = ecComboOption(m, o, false);
    if (bc) attachBands(opt, bc, null);
    renderChart('main', elEcMain, opt);
  } else {
    disposeChart('main'); elEcMain.innerHTML = '';
    disposeSmallEc();
    elEcSmall.innerHTML = list.map((c, i) =>
      '<div class="small-cell"><div class="chart-small" id="ecSm' + i + '"></div></div>').join('');
    list.forEach((c, i) => {
      const cell = document.getElementById('ecSm' + i);
      if (!cell) return;
      const has = hasAnyVal(seriesFor(c, m, rangeVal(m)).values) || hasAnyVal(seriesFor(c, o, rangeVal(o)).values);
      if (!has) { cell.innerHTML = '<div class="cell-note">无数据</div>'; return; }
      const cellOpt = ecComboCellOption(m, o, c, false);
      if (bc && c === bc) attachBands(cellOpt, bc, null);   // 格内 time 轴
      renderChart('ecsm' + i, cell, cellOpt);
    });
  }
}

function cleanupCharts() {
  hideOverlayLwcBoxes();
  removeSmallLwc();
  disposeChart('main');
  disposeSmallEc();
  elEcMain.innerHTML = '';
  elLwcSmall.innerHTML = '';
  elEcSmall.innerHTML = '';
}

function renderCharts(m) {
  const ov = ovMetric();
  if (ov) { renderComboCharts(m, ov); return; }   // 叠加态独立分支；下方单指标路径零改动
  const range = rangeVal(m);
  const bc = state.bands ? bandCompany() : null;         // F3:周期带开启且可用
  const isLwc = m.lib === 'lwc' && !bc;                  // 开启周期带时 lwc 指标改走 ECharts
  const mode = (bc && m.lib === 'lwc') ? 'overlay' : effMode(m);   // 单公司周期带=单张主图
  const list = activeCompanies();
  const anyData = state.companies.some((c) => hasAnyVal(seriesFor(c, m, range).values));

  elChartNote.hidden = true;
  const showNote = (msg) => { elChartNote.textContent = msg; elChartNote.hidden = false; };

  const ok = state.companies.length && anyData && list.length;
  elLwcMain.hidden  = !(ok && isLwc && mode === 'overlay');
  elEcMain.hidden   = !(ok && !isLwc && mode === 'overlay');
  elLwcSmall.hidden = !(ok && isLwc && mode === 'small');
  elEcSmall.hidden  = !(ok && !isLwc && mode === 'small');

  if (!state.companies.length) { cleanupCharts(); showNote('无数据 — valuation.json 加载失败或为空'); return; }
  if (!anyData)                { cleanupCharts(); showNote('无数据 — 该指标在数据文件中缺失'); return; }
  if (!list.length)            { cleanupCharts(); showNote('未选择公司 — 点上方公司开关以显示图形'); return; }

  if (isLwc && mode === 'overlay') {
    disposeChart('main'); elEcMain.innerHTML = '';
    removeSmallLwc(); elLwcSmall.innerHTML = '';
    disposeSmallEc(); elEcSmall.innerHTML = '';
    renderOverlayLwc(m, range);
  } else if (isLwc) {
    hideOverlayLwcBoxes();
    disposeChart('main'); elEcMain.innerHTML = '';
    disposeSmallEc(); elEcSmall.innerHTML = '';
    renderSmallLwc(m, range);
  } else if (mode === 'overlay') {
    hideOverlayLwcBoxes();
    removeSmallLwc(); elLwcSmall.innerHTML = '';
    disposeSmallEc(); elEcSmall.innerHTML = '';
    if (!echarts) { elEcMain.hidden = true; showNote('图表组件加载失败（ECharts CDN）— 刷新重试'); return; }
    // F3:周期带开启——lwc 指标走专用时间轴 option；ec 折线在原 option 上挂 markArea
    const opt = (bc && m.lib === 'lwc') ? ecBandLineOption(m, bc) : ecLineOption(m, false, null);
    if (bc && m.lib !== 'lwc') attachBands(opt, bc, null);
    renderChart('main', elEcMain, opt);
  } else {
    hideOverlayLwcBoxes();
    removeSmallLwc(); elLwcSmall.innerHTML = '';
    disposeChart('main'); elEcMain.innerHTML = '';
    if (!echarts) { elEcSmall.hidden = true; showNote('图表组件加载失败（ECharts CDN）— 刷新重试'); return; }
    disposeSmallEc();
    elEcSmall.innerHTML = list.map((c, i) =>
      '<div class="small-cell"><div class="chart-small" id="ecSm' + i + '"></div></div>'
    ).join('');
    list.forEach((c, i) => {
      const cell = document.getElementById('ecSm' + i);
      if (!cell) return;
      const s = seriesFor(c, m, 'q');
      if (!hasAnyVal(s.values)) { cell.innerHTML = '<div class="cell-note">无数据</div>'; return; }
      const cellOpt = m.chart === 'bar' ? ecBarOption(m, c, false) : ecLineOption(m, false, c);
      // F3:金额柱状为类目轴，from/to 映射到区间内实际类目；折线 time 轴直接挂
      if (bc && c === bc) attachBands(cellOpt, bc, m.chart === 'bar' ? s.dates : null);
      renderChart('ecsm' + i, cell, cellOpt);
    });
  }
}

/* —— 图下第 1 行：统计行（直读 stats，前端零计算；中性灰 + 公司色 marker）
      叠加时分两段，段首标指标名 —— */
function renderStats(m) {
  const el = document.getElementById('statsRows');
  if (!state.companies.length) { el.innerHTML = ''; return; }
  const o = ovMetric();
  if (!o) { el.innerHTML = statsRowsHTML(m); return; }
  el.innerHTML =
    '<div class="stat-sec-head">' + esc(m.label) + '</div>' + statsRowsHTML(m)
    + '<div class="stat-sec-head">' + esc(o.label) + '</div>' + statsRowsHTML(o);
}
function statsRowsHTML(m) {
  return state.companies.map((c) => {
    const st = (c.stats && c.stats[m.key] && typeof c.stats[m.key] === 'object') ? c.stats[m.key] : null;
    const head = '<span class="dot dot--sm" style="background:' + esc(c.color) + '"></span>'
      + '<span class="s-name">' + esc(c.name) + '</span>';
    if (!st || st.current == null) {
      return '<div class="stat-row"><div class="s-line">' + head + '<span class="s-body">—</span></div></div>';
    }
    const f = (v) => esc(fmtVal(m, v, c.currency));
    const wy = trimNum(st.window_years);
    const p = (st.percentile != null && isFinite(st.percentile)) ? Math.max(0, Math.min(1, st.percentile)) : null;
    const marker = p == null ? ''
      : '<span class="range-marker" style="left:' + (p * 100).toFixed(1) + '%;background:' + esc(c.color)
        + '" title="近' + esc(wy) + '年分位 ' + Math.round(p * 100) + '/100"></span>';
    // E10:P/B 早期年度层分母为总权益口径,其极值(min/max)仅形态参考,不作定量估值
    const pbShapeNote = (m.key === 'pb')
      ? '<span class="s-body" style="color:var(--faint)"> · 早期年度分母口径极值仅形态参考</span>'
      : '';
    return '<div class="stat-row">'
      + '<div class="s-line">' + head
      + '<span class="s-body">当前 ' + f(st.current) + '（' + esc(st.current_date || '—') + '）'
      + ' · 近' + esc(wy) + '年: min ' + f(st.min) + ' · 中位 ' + f(st.median) + ' · max ' + f(st.max) + '</span>'
      + pbShapeNote + '</div>'
      + '<div class="range-track">' + marker + '</div>'
      + '</div>';
  }).join('');
}

/* —— W11·F1:Forward P/E 当前值块（仅 pe 视图）——
      三家横排 forward_pe.value + N 位分析师;null 显「—」;醒目标注「分析师一致预期·
      非历史事实·随预期变动·来源 Yahoo」(浅琥珀 caveat 样式)。不画进曲线;切走隐藏。*/
function renderForwardBlock(m) {
  const el = document.getElementById('forwardBlock');
  if (!el) return;
  if (m.key !== 'pe' || !state.companies.length) { el.hidden = true; el.innerHTML = ''; return; }
  const cells = state.companies.map((c) => {
    const fp = c.forwardPe;
    const head = '<span class="dot dot--sm" style="background:' + esc(c.color) + '"></span>'
      + '<span class="fw-name">' + esc(c.name) + '</span>';
    if (!fp || fp.value == null || !isFinite(fp.value)) {
      return '<span class="fwd-cell">' + head + '<span class="fw-na">—</span></span>';
    }
    const val = (fp.value >= 100 ? fp.value.toFixed(0) : fp.value.toFixed(2));
    const an = (fp.analysts != null && isFinite(fp.analysts))
      ? '<span class="fw-an">' + esc(fp.analysts) + ' 位分析师</span>' : '';
    // E6:韩股无 forwardEps,forward_pe 为 Yahoo 直引(无 EPS 支撑),与 MU(有 EPS 隐含)区分来源透明度
    const srcAn = c.selfCalc
      ? '<span class="fw-an">韩股为直引 · 无 EPS 支撑</span>' : '';
    return '<span class="fwd-cell">' + head + '<span class="fw-val">' + esc(val) + '</span>' + an + srcAn + '</span>';
  }).join('');
  el.innerHTML =
    '<div class="fwd-head"><span class="fwd-title">Forward P/E · 分析师预期</span>'
    + '<span class="fwd-caveat">▲ 分析师一致预期 · 非历史事实 · 随预期变动 · 来源 Yahoo（韩股为直引，无 EPS 支撑）</span></div>'
    + '<div class="fwd-rows">' + cells + '</div>';
  el.hidden = false;
}

/* —— W11·F2c:capex 视图扩产计划附注（仅 capex 视图）——
      读 capexPlans（前端 fetch;缺则不显示);每家取前 1-2 条 title + 「详见公司页 →」链。
      不进曲线、不混入历史 capex 柱。*/
function renderCapexNote(m) {
  const el = document.getElementById('capexNote');

/* ======================================================================
   A2 原始数据表：全部三家 × 当前指标(+叠加) 全量时间点，长表、日期倒序；
   默认折叠；首屏 100 行、加载更多 +200（追加 DOM，不整表重建）；
   混粒度（日频×季度）不对齐合并，拆两张小表；CSV 全量 + BOM + 原始数值。
   ====================================================================== */
/* C1:折叠(details 未 open)时不构建/不排序 2.4 万行——只算轻量总行数刷新摘要;
   首次展开(或展开态下切指标/公司)才懒构建 datasets(rawRows 排序+HTML)并按 key 缓存。
   built=当前 key 的 body 是否已构建;shown 为各分组独立的已显示行数(混粒度双表各自计数)。 */
const rawState = { key: '', shown: [], datasets: null, built: false };

/* 指标在当前 range 下的粒度：daily / q（季度）；price 只有全史日频 */
function granOf(met) {
  if (met.key === 'price') return 'daily';
  if (!met.hasRange) return 'q';
  return state.range === 'daily' ? 'daily' : 'q';
}
/* 列头单位：表格里值已带单位符号，CSV 里数字为原始值 → 两套措辞 */
function unitOf(met, csv) {
  if (met.kind === 'pct')   return csv ? '（小数）' : '（%）';
  if (met.kind === 'ratio') return '（倍）';
  if (met.kind === 'days')  return '（天）';
  return csv ? '（原币 USD/KRW）' : '（原币）';   // money / price
}
/* 当前视图的表组：同粒度合并为一张长表；混粒度拆两张（不造稀疏假行） */
function rawGroups(m) {
  const o = ovMetric();
  if (!o) return [[m]];
  return granOf(m) === granOf(o) ? [[m, o]] : [[m], [o]];
}
/* 一组指标（1~2 个，同粒度）→ 行数组 {d, ci, vals[]}：日期倒序、同日按公司序 */
function rawRows(mets) {
  const rows = [];
  state.companies.forEach((c, ci) => {
    if (mets.length === 1) {
      const s = seriesFor(c, mets[0], rangeVal(mets[0]));
      s.dates.forEach((d, i) => rows.push({ d, ci, vals: [s.values[i]] }));
    } else {
      const map = new Map();   // 同粒度双指标按日期对齐（真缺口保留为 null）
      mets.forEach((met, k) => {
        const s = seriesFor(c, met, rangeVal(met));
        s.dates.forEach((d, i) => {
          if (!map.has(d)) map.set(d, [null, null]);
          map.get(d)[k] = s.values[i];
        });
      });
      map.forEach((vals, d) => rows.push({ d, ci, vals }));
    }
  });
  rows.sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : a.ci - b.ci));
  return rows;
}
function rawRowsHTML(mets, rows, from, to) {
  let html = '';
  const end = Math.min(to, rows.length);
  for (let i = from; i < end; i++) {
    const r = rows[i];
    const c = state.companies[r.ci];
    html += '<tr><td>' + esc(r.d) + '</td>'
      + '<td><span class="dot dot--sm" style="background:' + esc(c.color) + '"></span> ' + esc(c.name) + '</td>'
      + mets.map((met, k) => '<td class="num">' + esc(fmtVal(met, r.vals[k], c.currency)) + '</td>').join('')
      + '</tr>';
  }
  return html;
}
function rawFootHTML(gi, shown, total) {
  return shown < total
    ? '<button class="raw-more" data-g="' + gi + '">加载更多（已显示 ' + shown + ' / ' + total + ' 行）</button>'
    : '<div class="raw-total">共 ' + total + ' 行 · 已全部显示</div>';
}
/* C1:轻量总行数——不建行、不排序,单指标按序列长度求和;混粒度双指标同公司按日期并集计数。
   仅用于折叠态摘要显示,避免每次 render 全量 rawRows(2.4 万行排序)。 */
function rawCount(groups) {
  let n = 0;
  groups.forEach((mets) => {
    state.companies.forEach((c) => {
      if (mets.length === 1) {
        n += seriesFor(c, mets[0], rangeVal(mets[0])).dates.length;
      } else {
        const set = new Set();
        mets.forEach((met) => { seriesFor(c, met, rangeVal(met)).dates.forEach((d) => set.add(d)); });
        n += set.size;
      }
    });
  });
  return n;
}
/* C1:重活——构建 datasets(rawRows 排序) + body HTML。仅在 details 展开且当前 key 未构建时调用。 */
function buildRawBody() {
  const groups = rawGroups(curMetric());
  // shown 长度须与分组数匹配(混粒度双表→2 组,各自独立索引);缺项补 100
  if (!Array.isArray(rawState.shown) || rawState.shown.length !== groups.length) {
    rawState.shown = groups.map((_, i) => (rawState.shown && rawState.shown[i]) || 100);
  }
  const datasets = groups.map((mets) => ({ mets, rows: rawRows(mets) }));
  rawState.datasets = datasets;
  document.getElementById('rawBody').innerHTML = datasets.map((g, gi) => {
    const shown = Math.min(rawState.shown[gi] || 100, g.rows.length);
    rawState.shown[gi] = shown;
    const head = '<tr><th>日期</th><th>公司</th>'
      + g.mets.map((met) => '<th class="num">' + esc(met.label + unitOf(met, false)) + '</th>').join('') + '</tr>';
    const sub = datasets.length > 1 ? '<div class="raw-sub">' + esc(g.mets[0].label) + '</div>' : '';
    return sub + '<div class="raw-wrap"><table class="raw-table">'
      + '<thead>' + head + '</thead><tbody id="rawTbody' + gi + '">'
      + rawRowsHTML(g.mets, g.rows, 0, shown) + '</tbody></table></div>'
      + '<div id="rawFoot' + gi + '">' + rawFootHTML(gi, shown, g.rows.length) + '</div>';
  }).join('');
  rawState.built = true;
}
function renderRawData(m) {
  const box = document.getElementById('rawData');
  if (!state.companies.length) { box.hidden = true; return; }
  box.hidden = false;
  const o = ovMetric();
  const key = m.key + '|' + (o ? o.key : '') + '|' + ((m.hasRange || (o && o.hasRange)) ? state.range : 'q');
  const groups = rawGroups(m);
  // key 变化(切指标/公司/范围/叠加)→ 作废缓存:重置各组 shown、标记未构建、清 datasets
  if (key !== rawState.key) {
    rawState.key = key;
    rawState.shown = groups.map(() => 100);
    rawState.built = false;
    rawState.datasets = null;
  }
  // 摘要总行数用轻量计数(不排序);折叠态到此为止,不碰 2.4 万行
  document.getElementById('rawSummary').innerHTML =
    '<span class="caret"></span>原始数据（<b>' + rawCount(groups) + ' 行</b>）· 来源见上';
  if (box.open) {
    if (!rawState.built) buildRawBody();   // 展开态下 key 变化则重建
  } else {
    // 折叠态:不构建;清空 body 免残留上一 key 的表(下次展开触发 toggle 懒构建)
    document.getElementById('rawBody').innerHTML = '';
  }
}
/* CSV：全量（非仅已加载行）、UTF-8 带 BOM、列头含单位、数字原始值、日期 ISO；零请求 */
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv() {
  if (!state.companies.length) return;
  const m = curMetric();
  const o = ovMetric();
  const datasets = rawGroups(m).map((mets) => ({ mets, rows: rawRows(mets) }));
  const blocks = datasets.map((g) => {
    const head = ['日期', '公司'].concat(g.mets.map((met) => met.label + unitOf(met, true)));
    const lines = [head.map(csvCell).join(',')];
    g.rows.forEach((r) => {
      const c = state.companies[r.ci];
      lines.push([r.d, c.name].concat(g.mets.map((met, k) => (r.vals[k] == null ? '' : String(r.vals[k]))))
        .map(csvCell).join(','));
    });
    return lines.join('\r\n');
  });
  const csv = String.fromCharCode(0xFEFF) + blocks.join('\r\n\r\n') + '\r\n';   // BOM：Excel 中文兼容
  const rangeTok = (m.hasRange || (o && o.hasRange)) ? state.range : 'q';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'memory-cycle_' + m.key + (o ? '_' + o.key : '') + '_' + rangeTok + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* —— URL 状态同步：?m=&o=&c=&r=&b=（replaceState，可分享恢复；r 对 price 无效）
   &c= 为激活公司 chips（全选时省略）——&b=1 依赖恰好 1 家激活才生效，
   chips 不进 URL 则分享/刷新后历史周期视图永远无法恢复 —— */
function syncURL() {
  try {
    const m = curMetric();
    const o = ovMetric();
    let qs = '?m=' + encodeURIComponent(m.key);
    if (o) qs += '&o=' + encodeURIComponent(o.key);
    const act = state.companies.filter((c) => state.active[c.ticker]).map((c) => c.ticker);
    if (act.length && act.length < state.companies.length) {
      qs += '&c=' + act.map(encodeURIComponent).join(',');
    }
    if ((m.hasRange || (o && o.hasRange)) && state.range === 'long') qs += '&r=long';
    // C2:小多图 mode 写入 URL,可分享/刷新恢复（默认 overlay 省略；金额类强制 small 时 state.mode 未改，此处只反映用户显式选择）
    if (state.mode === 'small') qs += '&mode=small';
    if (state.bands) qs += '&b=1';   // F3:历史周期开关
    history.replaceState(null, '', qs);
  } catch (e) { /* file:// 等环境不支持时静默 */ }
}
let pendingActive = null;   // URL &c= 解析结果（parseURL 时公司数据未就绪，boot 中套用）
function parseURL() {
  try {
    const q = new URLSearchParams(location.search);
    const mk = q.get('m');
    if (mk && METRICS.some((x) => x.key === mk)) state.metric = mk;
    const ok = q.get('o');   // 非法或与主指标相同 → 置 null
    if (ok && ok !== state.metric && METRICS.some((x) => x.key === ok)) state.overlay = ok;
    const cs = q.get('c');   // 公司 chips（URLSearchParams 已做 percent 解码）
    if (cs != null) pendingActive = cs.split(',').filter(Boolean);
    const r = q.get('r');
    if (r === 'daily' || r === 'long') state.range = r;
    const md = q.get('mode');   // C2:恢复小多图/叠加 mode
    if (md === 'small' || md === 'overlay') state.mode = md;
    if (q.get('b') === '1') state.bands = true;   // F3
  } catch (e) {}
}

function drawFabBoard() {

  }));

    html += '<div class="fab-gantt"><div class="fab-axis">' + axis + '</div>';

      let bar = '';
      if (s != null && t != null) {
        const x0 = pct(s), w = Math.max(pct(t) - x0, 1.2), done = t <= FAB_TODAY, fe = Math.min(Math.max((FAB_TODAY - s) / (t - s), 0), 1) * 100;
        bar = '<div class="fab-bar ' + (done ? 'full' : '') + '" style="left:' + x0 + '%;width:' + w + '%;background:' + col + '22" title="' + esc(f.start_label) + ' → ' + esc(f.target_label) + '"><span class="fab-fill" style="width:' + (done ? 100 : fe) + '%;background:' + col + '"></span><span class="fab-rem" style="left:' + (done ? 100 : fe) + '%;color:' + col + '"></span><span class="fab-cap s">' + esc(f.start_date) + '</span><span class="fab-cap e"><b>' + esc(f.target_date) + '</b> ' + (FAB_STATUS_LAB[f.status] || '') + '</span></div>';

function render() {
  const m = curMetric();
  const o = ovMetric();
  renderSideNav();
  document.getElementById('metricTitle').textContent = o ? m.label + ' + ' + o.label : m.label;

  // 「扩产时间线」是特殊视图：主图区换成甘特，隐藏所有图表控件/统计/图表容器，提前返回
  if (m.isFabs) { renderFabView(); return; }
  exitFabView();

  // rangeSeg：任一参与指标 hasRange 即显示（range 只作用于 hasRange 的指标序列）
  const rm = m.hasRange ? m : (o && o.hasRange ? o : null);

  if (rm) {
    rs.querySelectorAll('button').forEach((b) => {
      b.textContent = rm.rangeLabels[b.dataset.range] || b.dataset.range;
      b.classList.toggle('is-active', b.dataset.range === state.range);
    });
  }
  const ms = document.getElementById('modeSeg');
  ms.hidden = !!m.forceSmall || !!o;   // 金额类锁小多图；叠加态布局由组合规则决定
  ms.querySelectorAll('button').forEach((b) => {
    b.classList.toggle('is-active', b.dataset.mode === state.mode);
  });

  // F3:「历史周期」开关——恰好 1 家激活且该家 bands 存在才可用（随公司 chips 联动）
  const bcAvail = bandCompany();
  const bandBtn = document.getElementById('bandBtn');
  bandBtn.disabled = !bcAvail;
  bandBtn.title = bcAvail
    ? '标注该公司财报既定事实区间（亏损期 / 营收收缩期）'
    : '单公司视图下可用';
  bandBtn.classList.toggle('is-active', !!(state.bands && bcAvail));

  renderOverlayCtl();
  renderChips();

  renderStats(m);
  renderForwardBlock(m);   // W11·F1:Forward P/E 块（仅 pe 视图）

  renderExplain(m);
  renderCapexNote(m);      // W11·F2c:扩产计划附注（仅 capex 视图）

  renderRawData(m);
  syncMeasureUI();
  if (fsActive()) fillFsInfobar();
  syncURL();
}

/* LWC 指标：离屏深色图 → takeScreenshot → 画布合成 */
async function renderExportLwc(m, stage) {
  const gen = ++exportGen;
  const is16 = state.ratio === '16:9';
  const range = rangeVal(m);
  const W = is16 ? 1920 : 1080, H = is16 ? 1080 : 1920;
  const padX = is16 ? 48 : 40, headH = is16 ? 150 : 176, footH = is16 ? 60 : 64;
  const cw = W - padX * 2, ch = H - headH - footH;
  const off = document.createElement('div');
  off.style.cssText = 'position:fixed;left:-100000px;top:0;width:' + cw + 'px;height:' + ch + 'px;';
  document.body.appendChild(off);
  let ctrl = null;
  try {
    const series = activeCompanies().map((c) => {
      const s = seriesFor(c, m, range);
      return { name: c.name, color: c.color, dates: s.dates, values: s.values };
    });
    ctrl = await createSeriesChart(off, { series, log: !!m.log, dark: true, fontSize: is16 ? 16 : 15 });
    // 等一帧让 LWC 完成布局绘制；rAF 在后台/隐藏标签页可能被节流，加超时兜底防挂起
    await new Promise((r) => {
      let done = false;
      const fin = () => { if (!done) { done = true; r(); } };
      requestAnimationFrame(() => requestAnimationFrame(fin));
      setTimeout(fin, 350);
    });
    if (gen !== exportGen || !state.exportOpen) return;

    const shot = ctrl.chart.takeScreenshot();
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(shot, 0, 0, shot.width, shot.height, padX, headH, cw, ch);
    // 标题 / 副题
    ctx.fillStyle = '#F2F4F8';
    ctx.font = (is16 ? '900 44px ' : '900 40px ') + '"Noto Sans SC", sans-serif';
    ctx.fillText(exportTitle(m), padX, is16 ? 64 : 68);
    ctx.fillStyle = '#8A96A8';
    ctx.font = (is16 ? '500 21px ' : '500 20px ') + '"Noto Sans SC", sans-serif';
    ctx.fillText(exportSubtitle(m), padX, is16 ? 102 : 108);
    // 公司色图例
    let lx = padX;
    const ly = is16 ? 134 : 148;
    activeCompanies().forEach((c) => {
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.arc(lx + 7, ly - 7, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#D5DAE2';
      ctx.font = (is16 ? '500 19px ' : '500 18px ') + '"Noto Sans SC", sans-serif';
      ctx.fillText(c.name, lx + 22, ly);
      lx += 22 + ctx.measureText(c.name).width + 28;
    });
    // 右下来源角标 + 左下站名
    ctx.fillStyle = '#5E6878';
    ctx.font = '500 17px "IBM Plex Mono", monospace';
    const corner = exportCorner(m);
    ctx.fillText(corner, W - 24 - ctx.measureText(corner).width, H - 22);
    ctx.fillStyle = '#3A4356';
    ctx.font = '600 17px "IBM Plex Mono", monospace';
    ctx.fillText('MEMORY-CYCLE', padX, H - 22);

    if (gen !== exportGen || !state.exportOpen) return;
    canvas.style.width = '100%'; canvas.style.height = '100%';
    stage.innerHTML = '';
    stage.appendChild(canvas);
    exportUI.canvas = canvas;
  } catch (e) {
    if (gen === exportGen && state.exportOpen) stage.innerHTML = darkNote('图表组件加载失败（Lightweight Charts CDN）— 关闭后重试');
  } finally {
    if (ctrl) ctrl.remove();
    off.remove();
  }
}

function applyRatioUI() {

  document.getElementById('ratio16').classList.toggle('is-active', is16);
  document.getElementById('ratio9').classList.toggle('is-active', !is16);
  const stage = document.getElementById('exportStage');

}

function renderExport() {
  exportGen++;                 // 使在途 LWC 合成过期
  exportUI.canvas = null;
  disposeChart('export');
  applyRatioUI();
  const stage = document.getElementById('exportStage');
  stage.innerHTML = '';

  if (!activeCompanies().length) { stage.innerHTML = darkNote('未选择公司'); return; }
