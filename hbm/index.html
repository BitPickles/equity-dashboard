/* ======================================================================
   W10 · F1 纯图表全屏
   —— 优先 Fullscreen API（.work 卡);不支持/失败回退 CSS 全屏。
      进出后 resize 所有活动图表实例（LWC fit / ECharts resize)。
      图下三行折叠进 .fs-infobar;数据表不进全屏。
   ====================================================================== */
const workEl = () => document.querySelector('.work');
function fsActive() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement)
    || workEl().classList.contains('work--css-fs');
}
function resizeAllCharts() {
  // ECharts:除 export 外全部 resize
  Object.keys(charts).forEach((k) => {
    if (k === 'export') return;
    try { charts[k].resize(); } catch (e) {}
  });
  // LWC:autoSize 已监听容器尺寸,这里再 fit 一次让内容重适配
  Object.keys(lwcCache).forEach((k) => {
    try { lwcCache[k].ctrl.fit(); } catch (e) {}
  });
}
/* C3:导出弹层若在全屏切换时开着,其 ECharts 实例(排除在 resizeAllCharts 外)须 resize 回
   非全屏下 #exportStage(.export-canvas-16/9)固定尺寸,否则画布残留全屏布局尺寸。
   LWC 导出路径为静态 canvas 截图(exportUI.canvas),尺寸随容器 100% 自适应,无需 resize。 */
function resizeExportChart() {
  if (state.exportOpen && charts['export']) {
    try { charts['export'].resize(); } catch (e) {}
  }
}
function syncFsButton() {
  const on = fsActive();
  const btn = document.getElementById('btnFs');
  btn.classList.toggle('is-active', on);
  btn.textContent = on ? '⛶ 退出全屏' : '⛶ 全屏';
  workEl().classList.toggle('is-fs', on);
  // 全屏态填充信息条;退出时清空以免残留
  if (on) fillFsInfobar();
  // 进出全屏尺寸变化 → 下一帧 resize（等浏览器完成布局）;全屏切换布局在部分
  // 环境（移动端/缩放)两帧内未必落定,再补一次延时 resize 兜底,确保图填满新尺寸。
  requestAnimationFrame(() => requestAnimationFrame(() => {
    resizeAllCharts();
    resizeExportChart();
    // 测量态下全屏切换后重挂覆盖层,坐标基准随新尺寸更新
    if (state.measure) refreshMeasureAttach();
  }));
  setTimeout(() => {
    resizeAllCharts();
    resizeExportChart();
    if (state.measure) refreshMeasureAttach();
  }, 140);
}
function fillFsInfobar() {
  const stats = document.getElementById('statsRows').innerHTML;
  const caveat = document.getElementById('caveatBar').innerHTML;
  document.getElementById('fsInfobarBody').innerHTML =
    '<div class="stats-block">' + stats + '</div>'
    + '<div class="caveat-bar" style="margin-top:8px">' + caveat + '</div>';
}
function enterCssFs() {
  workEl().classList.add('work--css-fs');
  syncFsButton();
}
function exitCssFs() {
  workEl().classList.remove('work--css-fs');
  syncFsButton();
}
function toggleFullscreen() {
  const el = workEl();
  // 已在 CSS 回退态 → 退出回退态
  if (el.classList.contains('work--css-fs')) { exitCssFs(); return; }
  const cur = document.fullscreenElement || document.webkitFullscreenElement;
  if (cur) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) {
    Promise.resolve(req.call(el)).catch(() => { enterCssFs(); });   // API 失败 → CSS 回退
  } else {
    enterCssFs();   // 不支持 → CSS 回退
  }
}

/* ======================================================================
   W10 · F2 区间测量 —— 框选两点 → Δ值（按 kind)/涨跌%（或 Δpp/Δ天)/时间跨度。
   仅"单图"视图可用（LWC 单张 或 ECharts 单张 main);小多图禁用。
   叠加态作用于主指标左轴（seriesIndex:0 = 主指标)。覆盖层绝对定位在 .chart-stage,
   仅测量态拦截指针;进出/切指标/切模式正确解绑。
   ====================================================================== */
let measureLayer = null, measureRect = null, measureHint = null, measureCard = null;
let measureStage = null;        // 当前挂载的 .chart-stage
const measureDrag = { on: false, x0: 0, y0: 0 };

function buildMeasureLayer() {
  if (measureLayer) return;
  measureLayer = document.createElement('div');
  measureLayer.className = 'measure-layer';
  measureRect = document.createElement('div'); measureRect.className = 'measure-rect';
  measureHint = document.createElement('div'); measureHint.className = 'measure-hint';
  measureHint.textContent = '拖拽框选两点';
  measureCard = document.createElement('div'); measureCard.className = 'measure-card';
  measureLayer.appendChild(measureRect);
  measureLayer.appendChild(measureHint);
  measureLayer.appendChild(measureCard);
  measureLayer.addEventListener('mousedown', onMeasureDown);
  measureLayer.addEventListener('mousemove', onMeasureMove);
  window.addEventListener('mouseup', onMeasureUp);
  measureLayer.addEventListener('touchstart', onMeasureTouchStart, { passive: false });
  measureLayer.addEventListener('touchmove', onMeasureTouchMove, { passive: false });
  window.addEventListener('touchend', onMeasureUp);
  // C3:系统手势/来电等中断触摸时 touchend 不触发,须 touchcancel 解绑清 measureDrag,否则拖拽态残留
  window.addEventListener('touchcancel', onMeasureUp);
  // 点空白（未拖动）清除已画选区
  measureLayer.addEventListener('click', (e) => {
    if (!measureDrag.on && e.target === measureLayer) clearMeasureSelection();
  });
}

/* 当前是否为可测量的"单图"视图:返回 {kind:'lwc'|'ec', stage, met} 或 null。
   —— LWC 单图:m.lib==='lwc' && !bands && overlay 模式 && 无叠加指标
   —— ECharts 单图:ecMain 可见（单指标折线 overlay / 周期带 / 双轴组合大图) */
function measurableView() {
  const m = curMetric();
  const o = ovMetric();
  const list = activeCompanies();
  if (!list.length) return null;
  const bc = state.bands ? bandCompany() : null;
  // 叠加含金额类 → 金额小多图,不可测量
  if (o && (m.kind === 'money' || o.kind === 'money')) return null;
  // ECharts 单张主图可见（#ecMain 未 hidden 且实例存在)
  if (!elEcMain.hidden && charts['main']) {
    return { kind: 'ec', stage: elEcMain, met: m };
  }
  // LWC 单张主图（overlay 模式、非周期带、无叠加)
  if (!o && !bc && m.lib === 'lwc' && effMode(m) === 'overlay' && !elLwcMain.hidden) {
    const key = ovKey(m, rangeVal(m));
    if (lwcCache[key]) return { kind: 'lwc', stage: elLwcMain, met: m, ctrl: lwcCache[key].ctrl };
  }
  return null;
}

/* 把覆盖层挂到当前可测量视图的 stage;不可测量则卸载并清态 */
function refreshMeasureAttach() {
  if (!state.measure) { detachMeasure(); return; }
  const view = measurableView();
  if (!view) { detachMeasure(); return; }
  buildMeasureLayer();
  if (measureStage && measureStage !== view.stage) {
    measureStage.classList.remove('is-measuring');
    if (measureLayer.parentNode === measureStage) measureStage.removeChild(measureLayer);
  }
  measureStage = view.stage;
  if (measureLayer.parentNode !== measureStage) measureStage.appendChild(measureLayer);
  measureStage.classList.add('is-measuring');
  clearMeasureSelection();
}
function detachMeasure() {
  if (measureStage) {
    measureStage.classList.remove('is-measuring');
    if (measureLayer && measureLayer.parentNode === measureStage) measureStage.removeChild(measureLayer);
    measureStage = null;
  }
  clearMeasureSelection();
}
function clearMeasureSelection() {
  measureDrag.on = false;
  if (measureRect) { measureRect.style.display = 'none'; }
  if (measureCard) { measureCard.style.display = 'none'; }
  if (measureHint) { measureHint.style.display = 'block'; }
}

/* 覆盖层内相对坐标 */
function layerXY(clientX, clientY) {
  const r = measureLayer.getBoundingClientRect();
  return [clientX - r.left, clientY - r.top];
}

/* 像素 → {t(ISO日期), v(数值)}。落在缺口/越界时值为 null,由展示层兜底。 */
function measurePoint(view, x, y) {
  if (view.kind === 'lwc') {
    const t = view.ctrl.timeAt(x);
    const v = view.ctrl.priceAt(y);
    return { t: isoFromLwcTime(t), v: (v == null || !isFinite(v)) ? null : v };
  }
  // ECharts:convertFromPixel 以主指标 seriesIndex:0（左轴)换算
  try {
    const p = charts['main'].convertFromPixel({ seriesIndex: 0 }, [x, y]);
    if (!p) return { t: null, v: null };
    const tv = p[0], vv = p[1];
    return {
      t: (typeof tv === 'number' && isFinite(tv)) ? new Date(tv).toISOString().slice(0, 10) : null,
      v: (typeof vv === 'number' && isFinite(vv)) ? vv : null,
    };
  } catch (e) { return { t: null, v: null }; }
}
function isoFromLwcTime(t) {
  if (t == null) return null;
  if (typeof t === 'string') return t;
  if (typeof t === 'object' && t.year) {
    const p2 = (x) => (x < 10 ? '0' + x : '' + x);
    return t.year + '-' + p2(t.month) + '-' + p2(t.day);
  }
  if (typeof t === 'number' && isFinite(t)) return new Date(t * 1000).toISOString().slice(0, 10);
  return null;
}

/* Δ值格式化 + 涨跌/百分点/天 + 时间跨度 —— 只呈现数值,无判断词 */
function fmtSpan(d1, d2) {
  if (!d1 || !d2) return '';
  const a = new Date(d1 + 'T00:00:00Z'), b = new Date(d2 + 'T00:00:00Z');
  let lo = a, hi = b;
  if (a > b) { lo = b; hi = a; }
  const days = Math.round((hi - lo) / 86400000);
  let span;
  if (days < 60) {
    span = days + ' 天';
  } else {
    let months = (hi.getUTCFullYear() - lo.getUTCFullYear()) * 12 + (hi.getUTCMonth() - lo.getUTCMonth());
    if (hi.getUTCDate() < lo.getUTCDate()) months -= 1;
    const yy = Math.floor(months / 12), mm = months % 12;
    span = (yy ? yy + '年' : '') + (mm ? mm + '月' : (yy ? '' : '0月'));
  }
  return span + '（' + d1 + ' → ' + d2 + '）';
}
/* 测量卡币种:主指标为金额/股价类且激活公司跨币种时,轴为裸价格标度,
   强制币种符号会误导（如 KRW 价被标成 $)——此时不带符号,只呈现裸数值。
   单一币种时用该币种;非金额类（比率/百分点/天)本就不吃币种。 */
function measureCurrency(m) {
  if (m.kind !== 'price' && m.kind !== 'money') return '';
  const curs = Array.from(new Set(activeCompanies().map((c) => c.currency).filter(Boolean)));
  return curs.length === 1 ? curs[0] : '__BARE__';   // 跨币种 → 裸数值标记
}
/* 裸数值格式化（跨币种股价/金额:无符号,保留量级可读) */
function bareNumFmt(m, v) {
  if (v == null || !isFinite(v)) return '—';
  if (m.kind === 'money') return moneyAxis(v, '');   // 复用轴格式（$/조 会退化;此处仅裸量级)
  const a = Math.abs(v);
  if (a >= 10000) return Math.round(v).toLocaleString('en-US');
  if (a >= 100) return String(Math.round(v));
  return v.toFixed(2);
}
function fmtMeasureVal(m, v, cur) {
  if (cur === '__BARE__') return bareNumFmt(m, v);
  return fmtVal(m, v, cur);
}

/* 测量结果卡 HTML（met 决定 Δ 语义:price/ratio/money=涨跌%;pct=Δpp;days=Δ天) */
function measureCardHTML(view, p1, p2) {
  const m = view.met;
  const cur = measureCurrency(m);
  const startD = p1.t, endD = p2.t;
  // 按时间先后排序展示（左→右)
  let a = p1, b = p2;
  if (startD && endD && startD > endD) { a = p2; b = p1; }
  const fa = (a.v == null) ? '—' : esc(fmtMeasureVal(m, a.v, cur));
  const fb = (b.v == null) ? '—' : esc(fmtMeasureVal(m, b.v, cur));
  let deltaHTML = '';
  if (a.v != null && b.v != null && isFinite(a.v) && isFinite(b.v)) {
    if (m.kind === 'pct') {
      const dpp = (b.v - a.v) * 100;
      // D1:方向由 ↑↓ 箭头(事实方向)表达,颜色中性;+/− 号保留数值符号语义
      const sign = dpp >= 0 ? '↑ +' : '↓ −';
      const cls = dpp >= 0 ? 'mc-up' : 'mc-dn';
      deltaHTML = '<span class="' + cls + '">' + sign + Math.abs(dpp).toFixed(1) + 'pp</span>';
    } else if (m.kind === 'days') {
      const dd = b.v - a.v;
      const sign = dd >= 0 ? '↑ +' : '↓ −';
      const cls = dd >= 0 ? 'mc-up' : 'mc-dn';
      deltaHTML = '<span class="' + cls + '">' + sign + Math.abs(Math.round(dd)) + ' 天</span>';
    } else {
      // price / ratio / money → 涨跌幅
      if (a.v !== 0) {
        const pct = (b.v / a.v - 1) * 100;
        const up = pct >= 0;
        const cls = up ? 'mc-up' : 'mc-dn';
        deltaHTML = '<span class="' + cls + '">' + (up ? '↑ +' : '↓ −') + Math.abs(pct).toFixed(1) + '%</span>';
      }
    }
  }
  const span = fmtSpan(a.t, b.t);
  let html = '<div class="mc-big">' + fa + ' → ' + fb + (deltaHTML ? ' · ' + deltaHTML : '') + '</div>';
  if (span) html += '<div class="mc-sub">' + esc(span) + '</div>';
  const note = (view.kind === 'ec' && ovMetric()) ? '<div class="mc-hd">按主指标 ' + esc(m.short) + '（左轴)</div>' : '';
  return note + html;
}

function positionMeasureCard(x2, y2) {
  const lw = measureLayer.clientWidth, lh = measureLayer.clientHeight;
  measureCard.style.display = 'block';
  const cw = measureCard.offsetWidth, ch = measureCard.offsetHeight;
  let cx = x2 + 14, cy = y2 + 14;
  if (cx + cw > lw - 4) cx = x2 - 14 - cw;
  if (cy + ch > lh - 4) cy = y2 - 14 - ch;
  measureCard.style.left = Math.max(2, cx) + 'px';
  measureCard.style.top = Math.max(2, cy) + 'px';
}
function drawMeasureRect(x1, y1, x2, y2) {
  const L = Math.min(x1, x2), T = Math.min(y1, y2), W = Math.abs(x2 - x1), H = Math.abs(y2 - y1);
  measureRect.style.display = 'block';
  measureRect.style.left = L + 'px';
  measureRect.style.top = T + 'px';
  measureRect.style.width = W + 'px';
  measureRect.style.height = H + 'px';
}
function updateMeasure(x2, y2, live) {
  const view = measurableView();
  if (!view) return;
  drawMeasureRect(measureDrag.x0, measureDrag.y0, x2, y2);
  const p1 = measurePoint(view, measureDrag.x0, measureDrag.y0);
  const p2 = measurePoint(view, x2, y2);
  measureHint.style.display = 'none';
  measureCard.innerHTML = measureCardHTML(view, p1, p2);
  positionMeasureCard(x2, y2);
}
function onMeasureDown(e) {
  if (e.button != null && e.button !== 0) return;
  e.preventDefault();
  const [x, y] = layerXY(e.clientX, e.clientY);
  measureDrag.on = true; measureDrag.x0 = x; measureDrag.y0 = y;
  updateMeasure(x, y, true);
}
function onMeasureMove(e) {
  if (!measureDrag.on) return;
  const [x, y] = layerXY(e.clientX, e.clientY);
  updateMeasure(x, y, true);
}
function onMeasureUp(e) {
  if (!measureDrag.on) return;
  measureDrag.on = false;   // 选区保留展示,直至清除
}
function onMeasureTouchStart(e) {
  if (!e.touches || !e.touches.length) return;
  e.preventDefault();
  const t = e.touches[0];
  const [x, y] = layerXY(t.clientX, t.clientY);
  measureDrag.on = true; measureDrag.x0 = x; measureDrag.y0 = y;
  updateMeasure(x, y, true);
}
function onMeasureTouchMove(e) {
  if (!measureDrag.on || !e.touches || !e.touches.length) return;
  e.preventDefault();
  const t = e.touches[0];
  const [x, y] = layerXY(t.clientX, t.clientY);
  updateMeasure(x, y, true);
}
function toggleMeasure() {
  const btn = document.getElementById('btnMeasure');
  if (btn.disabled) return;
  state.measure = !state.measure;
  btn.classList.toggle('is-active', state.measure);
  refreshMeasureAttach();
}

/* ======================================================================
   事件绑定 / 启动
   ====================================================================== */
function bindEvents() {
  document.getElementById('sideNav').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-m]');
    if (!btn || btn.dataset.m === state.metric) return;
    state.metric = btn.dataset.m;
    if (state.overlay === state.metric) state.overlay = null;   // 主指标切到 overlay 同名 → 清叠加
    render();
  });
  document.getElementById('overlayCtl').addEventListener('change', (e) => {
    if (!e.target || e.target.id !== 'overlaySel') return;
    const v = e.target.value;
    state.overlay = (v && v !== state.metric && METRICS.some((x) => x.key === v)) ? v : null;
    render();
  });
  document.getElementById('overlayCtl').addEventListener('click', (e) => {
    if (e.target.closest('#overlayOff')) { state.overlay = null; render(); }
  });
  document.getElementById('rangeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-range]');
    if (!btn || btn.dataset.range === state.range) return;
    state.range = btn.dataset.range;
    render();
  });
  // F3:「历史周期」开关（disabled 时点击不触发 click，双保险再查一次）
  document.getElementById('bandSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('#bandBtn');
    if (!btn || btn.disabled) return;
    state.bands = !state.bands;
    render();
  });
  document.getElementById('modeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn || btn.dataset.mode === state.mode) return;
    state.mode = btn.dataset.mode;
    render();
  });
  document.getElementById('chipRow').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-ticker]');
    if (!btn) return;
    state.active[btn.dataset.ticker] = !state.active[btn.dataset.ticker];
    // C2/回归:公司 chips 切换后若历史周期不再可用（激活≠1 家或该家无 bands），
    // 立即校正 state.bands=false——否则 syncURL() 仍写 &b=1（多公司下自相矛盾），
    // 且退回单公司时周期带会在用户未重新开启的情况下静默复活（boot 2609 同款保护，运行时补齐）
    if (state.bands && !bandCompany()) state.bands = false;
    render();
  });

  // C1:原始数据表展开时懒构建(折叠态从不排序 2.4 万行)。details 的 toggle 在 open 状态切换时触发。
  document.getElementById('rawData').addEventListener('toggle', (e) => {
    if (e.target.open && !rawState.built) buildRawBody();
  });
  // A2 原始数据表：加载更多（追加 DOM，不整表重建）+ CSV 全量下载
  document.getElementById('rawBody').addEventListener('click', (e) => {
    const btn = e.target.closest('button.raw-more');
    if (!btn || !rawState.datasets) return;
    const gi = +btn.dataset.g;
    const g = rawState.datasets[gi];
    if (!g) return;
    const from = Math.min(rawState.shown[gi] || 100, g.rows.length);
    const to = Math.min(from + 200, g.rows.length);
    rawState.shown[gi] = to;
    const tbody = document.getElementById('rawTbody' + gi);
    if (tbody) tbody.insertAdjacentHTML('beforeend', rawRowsHTML(g.mets, g.rows, from, to));
    const foot = document.getElementById('rawFoot' + gi);
    if (foot) foot.innerHTML = rawFootHTML(gi, to, g.rows.length);
  });
  document.getElementById('btnCsv').addEventListener('click', downloadCsv);

  document.getElementById('btnExport').addEventListener('click', openExport);
  document.getElementById('closeExport').addEventListener('click', closeExport);
  document.getElementById('ratio16').addEventListener('click', () => setRatio('16:9'));
  document.getElementById('ratio9').addEventListener('click', () => setRatio('9:16'));
  document.getElementById('downloadPng').addEventListener('click', downloadPng);
  document.getElementById('exportOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'exportOverlay') closeExport();
  });
  // W10 F1 全屏 / F2 测量 按钮
  document.getElementById('btnFs').addEventListener('click', toggleFullscreen);
  document.getElementById('btnMeasure').addEventListener('click', toggleMeasure);
  // Fullscreen API 态变化（含用户按 Esc 退原生全屏）→ 同步按钮/布局/resize
  document.addEventListener('fullscreenchange', syncFsButton);
  document.addEventListener('webkitfullscreenchange', syncFsButton);

  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (state.exportOpen) { closeExport(); return; }   // Esc 关闭导出覆盖层
    // Esc:先清测量选区;再退 CSS 回退全屏（原生全屏由浏览器自身处理 Esc)
    if (state.measure && measureRect && measureRect.style.display !== 'none') {
      clearMeasureSelection(); return;
    }
    if (workEl().classList.contains('work--css-fs')) { exitCssFs(); return; }
    if (state.measure) toggleMeasure();
  });

  window.addEventListener('resize', () => {
    Object.keys(charts).forEach((k) => { try { charts[k].resize(); } catch (e) {} });
  });
}

async function boot() {
  elLwcMain = document.getElementById('lwcMain');
  elEcMain = document.getElementById('ecMain');
  elLwcSmall = document.getElementById('lwcSmallGrid');
  elEcSmall = document.getElementById('ecSmallGrid');
  elChartNote = document.getElementById('chartNote');

  bindEvents();
  parseURL();

  let raw = null;
  try {
    raw = await loadJSON('data/valuation.json');
  } catch (e) {
    document.getElementById('loadErr').hidden = false;
  }
  if (raw) {
    state.generated = (typeof raw.generated_at === 'string' && raw.generated_at.length >= 10)
      ? raw.generated_at.slice(0, 10) : '—';
    state.companies = transform(raw);
    // 默认只显示 SK 海力士（000660.KS）；数据里没有该家时兜底为全选，避免空图
    const DEFAULT_TICKER = '000660.KS';
    const hasDefault = state.companies.some((c) => c.ticker === DEFAULT_TICKER);
    state.companies.forEach((c) => { state.active[c.ticker] = hasDefault ? (c.ticker === DEFAULT_TICKER) : true; });
    // URL &c= 恢复公司 chips（&b=1 的历史周期视图需单公司激活才能还原）；
    // 无有效交集（全非法/空）则保持全选，避免坏链接渲染空图
    if (Array.isArray(pendingActive)
        && state.companies.some((c) => pendingActive.includes(c.ticker))) {
      state.companies.forEach((c) => { state.active[c.ticker] = pendingActive.includes(c.ticker); });
    }
    // C2:&b=1 依赖恰好 1 家激活且该家有 bands；若加载后条件不成立（激活≠1 家或该家无 bands），
    // 立即校正 state.bands=false,避免与置灰的按钮态不一致而静默残留（后续单选公司会突然复活周期带）
    if (state.bands && !bandCompany()) state.bands = false;
  }
  document.getElementById('genDate').textContent = state.generated;

  // W11·F2c:扩产计划（capex 视图附注用）——失败静默降级为 null，附注不显示，不影响主体
  try { capexPlans = await loadJSON('data/capex_plans.json'); } catch (e) { capexPlans = null; }
  try { fabsData = await loadJSON('data/fabs.json'); } catch (e) { fabsData = null; }

  try { echarts = await echartsReady; } catch (e) { echarts = null; }

  render();
}

boot();
</script>
</body>
</html>
