<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扩产时间线 · 存储三巨头估值看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<style>
  .intro { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin: 2px 0 18px; }
  .intro b { color: var(--ink); font-weight: 700; }

  /* 图例 + 过滤 */
  .legend-bar { display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center; margin-bottom:18px; font-size:12.5px; color:var(--muted); }
  .lg { display:inline-flex; align-items:center; gap:6px; }
  .lg .sw { width:22px; height:11px; border-radius:3px; display:inline-block; }
  .lg .sw.hatch { background-image:repeating-linear-gradient(45deg, currentColor 0 3px, transparent 3px 6px); opacity:.55; }
  .lg .dot9 { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .filter-toggle { margin-left:auto; display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none; color:var(--muted); }
  .filter-toggle input { accent-color: var(--co-samsung); width:14px; height:14px; }

  /* 甘特 */
  .co-block { margin-bottom: 26px; }
  .co-head { display:flex; align-items:center; gap:10px; margin:0 0 10px; }
  .co-head .dot { width:12px; height:12px; border-radius:50%; }
  .co-head h2 { font-size:17px; margin:0; font-weight:800; letter-spacing:.2px; }
  .co-head .cnt { font-size:12px; color:var(--faint); font-weight:500; }

  .gantt { position:relative; border:1px solid var(--border); border-radius:12px; background:var(--card); overflow:hidden; }
  /* 年份刻度 */
  .axis { position:relative; height:26px; margin-left:var(--labw); border-bottom:1px solid var(--border-soft); background:var(--field-bg); }
  .axis .yr { position:absolute; top:0; height:100%; display:flex; align-items:center; font-size:11px; color:var(--faint); font-family:'IBM Plex Mono',monospace; padding-left:5px; border-left:1px solid var(--border-soft); }
  .row { position:relative; display:flex; align-items:stretch; border-top:1px solid var(--row-line); min-height:44px; }
  .row:first-child { border-top:none; }
  .row.foundry { background:repeating-linear-gradient(0deg,transparent,transparent),var(--subcard-bg); }
  .row-lab { width:var(--labw); flex:0 0 var(--labw); box-sizing:border-box; padding:8px 12px 8px 14px; border-right:1px solid var(--border-soft); }
  .row-lab .nm { font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.35; }
  .row-lab .meta { margin-top:3px; display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; }
  .tag { font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:4px; letter-spacing:.2px; white-space:nowrap; }
  .tag.storage { background:rgba(46,111,230,.10); color:#2258b8; }
  .tag.packaging { background:rgba(14,140,140,.12); color:#0b6d6d; }
  .tag.foundry { background:rgba(138,143,155,.15); color:#5c6470; }
  .tag.loc { background:var(--field-bg); color:var(--faint); font-weight:600; border:1px solid var(--border-soft); }
  .row-lab a.src { font-size:10px; color:var(--link); text-decoration:none; font-weight:600; }
  .row-lab a.src:hover { text-decoration:underline; }
  .tier-b-flag { font-size:9px; color:var(--tier-b); font-weight:700; }

  .track { position:relative; flex:1; min-width:0; }
  .bar { position:absolute; top:50%; transform:translateY(-50%); height:16px; border-radius:5px; display:flex; align-items:center; box-shadow:0 1px 2px rgba(20,23,29,.08); }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; border-radius:5px 0 0 5px; opacity:1; }
  .bar .rem  { position:absolute; right:0; top:0; bottom:0; border-radius:0 5px 5px 0; background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px); }
  .bar.full .rem { display:none; }
  .bar .cap { position:absolute; font-size:10px; font-family:'IBM Plex Mono',monospace; white-space:nowrap; color:var(--faint); top:50%; transform:translateY(-50%); }
  .bar .cap.s { right:calc(100% + 6px); }
  .bar .cap.e { left:calc(100% + 6px); }
  .bar .cap.e b { color:var(--muted); font-weight:600; }
  /* 开口条(投产待定)：右端渐隐箭头 */
  .bar.open { border-radius:5px; }
  .bar.open::after { content:'▸'; position:absolute; right:-13px; top:50%; transform:translateY(-50%); font-size:11px; }
  /* 仅目标点(开工待定)：菱形标记 */
  .diamond { position:absolute; top:50%; width:12px; height:12px; transform:translate(-50%,-50%) rotate(45deg); border-radius:2px; box-shadow:0 1px 2px rgba(20,23,29,.12); }
  .diamond-cap { position:absolute; top:50%; transform:translateY(-50%); font-size:10px; font-family:'IBM Plex Mono',monospace; color:var(--faint); }
  /* 今天线 */
  .today { position:absolute; top:0; bottom:0; width:0; border-left:2px dashed var(--loss); z-index:3; }
  .today .lab { position:absolute; top:-22px; left:-16px; font-size:10px; font-weight:700; color:var(--loss); font-family:'IBM Plex Mono',monospace; }
  .today-wrap { position:absolute; left:var(--labw); right:0; top:26px; bottom:0; pointer-events:none; z-index:3; }

  .status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex:0 0 auto; }

  /* 待定卡 */
  .tbd { margin-top:12px; }
  .tbd h3 { font-size:12.5px; color:var(--faint); font-weight:700; margin:0 0 8px; }
  .tbd-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  .tbd-card { border:1px dashed var(--border-line); border-radius:10px; padding:10px 12px; background:var(--field-bg); }
  .tbd-card .nm { font-size:12.5px; font-weight:700; color:var(--ink); }
  .tbd-card .why { font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .tbd-card a { font-size:10px; color:var(--link); text-decoration:none; font-weight:600; }

  .foot-note { font-size:11.5px; color:var(--faint); line-height:1.7; margin-top:22px; padding-top:14px; border-top:1px solid var(--border-soft); }
  @media (max-width:720px){
    :root { --labw:150px; }
    .gantt { overflow-x:auto; }
  }
</style>
</head>
<body>
<div class="wrap" style="--labw:300px">

  <header class="top">
    <a href="index.html" class="crumb">← 看板</a>
    <div class="title-wrap">
      <div class="title">扩产时间线</div>
      <div class="subtitle">FAB BUILDOUT · GROUNDBREAK → RAMP</div>
    </div>
    <nav class="top-nav" id="topNav"></nav>
  </header>

  <p class="intro">
    三家原厂在建与规划的<b>晶圆厂 / 先进封装厂 / 扩建项目</b>——每条进度条从<b>开工（破土/动工）</b>横跨到<b>预计投产（首片晶圆/完工）</b>，实心为已推进部分、斜纹为剩余。日期均取自可核实的一手来源（公司官方新闻稿、SEC 8-K、政府 CHIPS/NIST 公告、官方 IR），<b>为公司指引而非承诺，可能随市况调整</b>；拿不到确切日期的照实标「待定」，绝不臆测。三星为集团口径，含代工厂，仅作参照。
  </p>

  <div class="legend-bar">
    <span class="lg"><span class="sw" style="background:var(--co-mu)"></span>Micron</span>
    <span class="lg"><span class="sw" style="background:var(--co-hynix)"></span>SK Hynix</span>
    <span class="lg"><span class="sw" style="background:var(--co-samsung)"></span>Samsung</span>
    <span class="lg"><span class="tag storage">存储</span></span>
    <span class="lg"><span class="tag packaging">封装</span></span>
    <span class="lg"><span class="tag foundry">代工</span></span>
    <span class="lg" style="color:var(--co-mu)"><span class="sw hatch"></span>剩余(至投产)</span>
    <label class="filter-toggle"><input type="checkbox" id="fdToggle" checked>含代工厂（三星集团口径）</label>
  </div>

  <div id="board"></div>
  <div id="loadErr" hidden style="color:var(--loss);padding:20px;text-align:center">无法加载 data/fabs.json</div>

  <p class="foot-note" id="footNote"></p>

</div>

<script type="module">
import { injectTopNav } from './assets/shared.js';
injectTopNav(document.getElementById('topNav'), 'fabs');

const COLORS = { 'MU':'#2E6FE6', '000660.KS':'#F5822A', '005930.KS':'#7B61FF' };
const CO_NAME = { 'MU':'Micron', '000660.KS':'SK Hynix', '005930.KS':'Samsung' };
const SCOPE_LAB = { storage:'存储', packaging:'封装', foundry:'代工' };
const STATUS_COLOR = { planned:'#A6ABB5', construction:'#2E6FE6', ramping:'#0E8C8C', operational:'#1A7F4E' };
const STATUS_LAB = { planned:'规划', construction:'在建', ramping:'爬产', operational:'已投产' };
const TODAY = 2026 + (7-1)/12;   // 2026-07

/* 日期字符串 → 小数年。"YYYY-MM"→Y+(M-1)/12；"YYYY"→Y+0.5(标注为年内中点)；null→null */
function toYr(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{4})(?:-(\d{2}))?$/);
  if (!m) return null;
  return m[2] ? (+m[1] + (+m[2]-1)/12) : (+m[1] + 0.5);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

fetch('data/fabs.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(render)
  .catch(()=>{ document.getElementById('loadErr').hidden=false; });

let DATA=null, SHOW_FOUNDRY=true;
function render(d){
  DATA=d;
  document.getElementById('footNote').innerHTML =
    esc(d.note || '') + ' · 数据整理 <span class="mono">'+esc(d.generated_at||'')+'</span>';
  document.getElementById('fdToggle').addEventListener('change', e=>{ SHOW_FOUNDRY=e.target.checked; draw(); });
  draw();
}

function draw(){
  const d=DATA, board=document.getElementById('board');
  // 轴范围：跨所有有日期的项
  let lo=Infinity, hi=-Infinity;
  for(const co of Object.keys(d.companies)) for(const f of d.companies[co]){
    for(const v of [toYr(f.start_date), toYr(f.target_date)]) if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v); }
  }
  lo=Math.floor(Math.min(lo,TODAY)); hi=Math.ceil(Math.max(hi,TODAY))+0.15;
  const span=hi-lo;
  const pct=v=>((v-lo)/span*100);

  let html='';
  for(const co of ['MU','000660.KS','005930.KS']){
    let fabs=d.companies[co]||[];
    if(!SHOW_FOUNDRY) fabs=fabs.filter(f=>f.scope!=='foundry');
    // 拆：有起点或终点的进甘特；两头皆无的进「待定」
    const timed=fabs.filter(f=>toYr(f.start_date)!=null || toYr(f.target_date)!=null);
    const tbd=fabs.filter(f=>toYr(f.start_date)==null && toYr(f.target_date)==null);
    // 甘特内排序：按开工(缺则用目标)升序
    timed.sort((a,b)=>((toYr(a.start_date)??toYr(a.target_date))-(toYr(b.start_date)??toYr(b.target_date))));
    const col=COLORS[co];

    html+=`<div class="co-block"><div class="co-head"><span class="dot" style="background:${col}"></span>`+
          `<h2 style="color:${col}">${CO_NAME[co]}</h2><span class="cnt">${fabs.length} 个项目</span></div>`;

    // 轴刻度
    let axis='';
    for(let y=Math.ceil(lo); y<=Math.floor(hi); y++) axis+=`<div class="yr" style="left:${pct(y)}%">${y}</div>`;
    html+=`<div class="gantt"><div class="axis">${axis}</div>`;

    for(const f of timed){
      const s=toYr(f.start_date), t=toYr(f.target_date);
      const stColor=STATUS_COLOR[f.status]||'#888';
      const meta=`<div class="meta"><span class="status-dot" style="background:${stColor}" title="${STATUS_LAB[f.status]||''}"></span>`+
        `<span class="tag ${f.scope}">${SCOPE_LAB[f.scope]||f.scope}</span>`+
        `<span class="tag loc">${esc(f.location.split('（')[0].slice(0,14))}</span>`+
        `<a class="src" href="${esc(f.source_url)}" target="_blank" rel="noopener" title="${esc(f.source)} · ${esc(f.asof)}">来源↗</a>`+
        (f.tier==='B'?`<span class="tier-b-flag" title="${esc(f.note)}">低置信</span>`:'')+
        `</div>`;
      let barHtml='';
      if(s!=null && t!=null){
        const x0=pct(s), x1=pct(t), w=Math.max(x1-x0,1.2);
        const done=t<=TODAY;
        const fillEnd=Math.min(Math.max((TODAY-s)/(t-s),0),1)*100;
        barHtml=`<div class="bar ${done?'full':''}" style="left:${x0}%;width:${w}%;background:${col}22" title="${esc(f.start_label)} → ${esc(f.target_label)}">`+
          `<span class="fill" style="width:${done?100:fillEnd}%;background:${col}"></span>`+
          `<span class="rem" style="color:${col};background:${col}"></span>`+
          `<span class="cap s">${esc(f.start_date)}</span>`+
          `<span class="cap e"><b>${esc(f.target_date)}</b> ${STATUS_LAB[f.status]||''}</span></div>`;
      } else if(s!=null && t==null){
        // 有开工、投产待定：开口条 start→今天
        const x0=pct(s), x1=pct(Math.max(TODAY,s+0.4)), w=Math.max(x1-x0,1.2);
        barHtml=`<div class="bar open" style="left:${x0}%;width:${w}%;background:${col};color:${col}" title="${esc(f.start_label)} · 投产待定">`+
          `<span class="cap s">${esc(f.start_date)}</span>`+
          `<span class="cap e" style="left:calc(100% + 16px)">投产待定</span></div>`;
      } else {
        // 无开工、仅目标：菱形
        const x=pct(t);
        barHtml=`<span class="diamond" style="left:${x}%;background:${col}" title="${esc(f.target_label)} · 开工待定"></span>`+
          `<span class="diamond-cap" style="left:calc(${x}% + 11px)"><b>${esc(f.target_date)}</b> 完工·开工待定</span>`;
      }
      html+=`<div class="row ${f.scope==='foundry'?'foundry':''}">`+
        `<div class="row-lab"><div class="nm">${esc(f.name)}</div>${meta}</div>`+
        `<div class="track">${barHtml}</div></div>`;
    }
    // 今天线（覆盖整个甘特高度）
    html+=`<div class="today-wrap"><div class="today" style="left:${pct(TODAY)}%"><span class="lab">今天</span></div></div>`;
    html+=`</div>`; // .gantt

    if(tbd.length){
      html+=`<div class="tbd"><h3>规划中 · 日期待定（官方未公布开工/投产时点）</h3><div class="tbd-grid">`;
      for(const f of tbd){
        html+=`<div class="tbd-card"><div class="nm">${esc(f.name)}</div>`+
          `<div class="why">${esc(f.amount||'')}${f.amount?' · ':''}${esc(f.target_label||f.start_label||'')}</div>`+
          `<a href="${esc(f.source_url)}" target="_blank" rel="noopener">来源↗ ${esc(f.source)}</a></div>`;
      }
      html+=`</div></div>`;
    }
    html+=`</div>`; // .co-block
  }
  board.innerHTML=html;
}
</script>
</body>
</html>
