name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare clean publish directory
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -av ./ ./_site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '**/node_modules/' \
            --exclude '_site/' \
            --exclude 'tmp/' \
            --exclude 'review/' \
            --exclude 'poster/' \
            --exclude 'web/' \
            --exclude 'memory/' \
            --exclude 'logs/' \
            --exclude 'projects/' \
            --exclude 'tasks/' \
            --exclude 'skills/' \
            --exclude 'archive/' \
            --exclude 'canvas/' \
            --exclude 'docs/' \
            --exclude 'scripts/' \
            --exclude 'polymarket-monitor/' \
            --exclude '.openclaw/' \
            --exclude '.clawdhub/' \
            --exclude '.clawhub/' \
            --exclude '**/*.bak' \
            --exclude '**/*.stub' \
            --exclude '.DS_Store' \
            --exclude 'debug-report.md' \
            --exclude 'SOUL.md' \
            --exclude 'IDENTITY.md' \
            --exclude 'HEARTBEAT.md' \
            --exclude 'TOOLS.md' \
            --exclude 'USER.md' \
            --exclude 'AGENTS.md' \
            --exclude 'MEMORY.md' \
            --exclude 'CLAUDE.md' \
            --exclude 'VERSIONING.md' \
            --exclude 'README.md' \
            --exclude 'data/protocols/PROGRESS.md' \
            --exclude 'data/protocols/README.md' \
            --exclude 'data/protocols/**/README.md' \
            --exclude 'data/protocols/**/*.md' \
            --exclude 'show_portfolio.py' \
            --exclude 'buyback_candidates.csv' \
            --exclude 'equity/debug.html' \
            --exclude 'equity/final-debug.html' \
            --exclude 'equity/simple-debug.html' \
            --exclude 'equity/simple-test.html' \
            --exclude 'equity/test-proto.html' \
            --exclude 'equity/test-tevratio.html' \
            --exclude 'equity/test_fetch.html' \
            --exclude 'daily-poster/output/comments.html' \
            --exclude 'daily-poster/output/comments.json'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
